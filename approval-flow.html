// --- 插入节点浮层菜单 ---
let addNodeInsertIndex = -1;
function showAddNodeMenu(event, insertIndex) {
  closeAddNodeMenu();
  addNodeInsertIndex = insertIndex;
  const menu = document.createElement('div');
  menu.className = 'add-node-menu';
  menu.id = 'addNodeMenu';
  let html = '<div class="add-node-menu-item" onclick="insertFlowNode(\'approval\')"><div class="node-card-icon approval">' + nodeIcons.approval + '</div><div><div class="add-node-menu-label">审批节点</div><div class="add-node-menu-note">指定人审批，通过后流程继续</div></div></div>';
  html += '<div class="add-node-menu-item" onclick="insertFlowNode(\'cc\')"><div class="node-card-icon cc">' + nodeIcons.cc + '</div><div><div class="add-node-menu-label">抄送节点</div><div class="add-node-menu-note">发通知给指定人，不阻塞流程</div></div></div>';
  html += '<div class="add-node-menu-item disabled" onclick="event.stopPropagation()"><div class="node-card-icon end"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg></div><div><div class="add-node-menu-label">IF 条件</div><div class="add-node-menu-note">主原型中体验</div></div></div>';
  html += '<div class="add-node-menu-item disabled" onclick="event.stopPropagation()"><div class="node-card-icon end"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></div><div><div class="add-node-menu-label">飞书通知</div><div class="add-node-menu-note">主原型中体验</div></div></div>';
  menu.innerHTML = html;
  document.body.appendChild(menu);
  // 定位到「+」按钮旁，防止溢出屏幕
  const btn = event.currentTarget || event.target;
  const rect = btn.getBoundingClientRect();
  let left = rect.right + 10;
  if (left + 230 > window.innerWidth) left = rect.left - 240;
  let top = rect.top - 10;
  if (top + 240 > window.innerHeight) top = window.innerHeight - 250;
  menu.style.left = left + 'px';
  menu.style.top = Math.max(10, top) + 'px';
  event.stopPropagation();
}

function closeAddNodeMenu() {
  const menu = document.getElementById('addNodeMenu');
  if (menu) menu.remove();
  addNodeInsertIndex = -1;
}

// 点击浮层外关闭插入菜单
document.addEventListener('click', function (e) {
  const menu = document.getElementById('addNodeMenu');
  if (menu && !menu.contains(e.target)) closeAddNodeMenu();
});

// 生成节点唯一编码 (approval_N / cc_N)
function nextNodeCode(type) {
  let max = 0;
  workflowNodes.forEach(n => {
    if (n.code && n.code.startsWith(type + '_')) {
      const num = parseInt(n.code.slice(type.length + 1), 10);
      if (!isNaN(num) && num > max) max = num;
    }
  });
  return type + '_' + (max + 1);
}

// 在指定位置插入节点
function insertFlowNode(type) {
  const idx = addNodeInsertIndex;
  closeAddNodeMenu();
  if (idx < 0) return;
  const code = nextNodeCode(type);
  let node;
  if (type === 'approval') {
    node = { id: code, type: 'approval', name: '审批节点', code: code,
      config: { mode: 'single', approverType: 'fixed', approvers: [], paramRef: '', orgType: 'direct-supervisor', orgDept: '',
        emptyHandler: 'transfer-to-owner', emptyHandlerPerson: '', rejectBehavior: 'end', rollbackTarget: '', commentRequired: false } };
  } else {
    node = { id: code, type: 'cc', name: '抄送节点', code: code,
      config: { recipients: [], recipientsType: 'fixed', recipientsParamRef: '', note: '' } };
  }
  workflowNodes.splice(idx, 0, node);
  const flow = getCurrentFlow();
  if (flow) flow.updatedAt = nowFull();
  renderView();
  showToast('success', '已添加节点', (type === 'approval' ? '审批节点' : '抄送节点') + '已插入流程，请完成配置');
  openNodeConfig(node.id);
}

// 删除节点（开始/结束不可删）
function deleteFlowNode(nodeId) {
  const idx = workflowNodes.findIndex(n => n.id === nodeId);
  if (idx < 0) return;
  const node = workflowNodes[idx];
  if (node.type === 'start' || node.type === 'end') return;
  workflowNodes.splice(idx, 1);
  if (configDrawerNode && configDrawerNode.id === nodeId) closeConfigDrawer();
  if (selectedNodeId === nodeId) selectedNodeId = null;
  const flow = getCurrentFlow();
  if (flow) flow.updatedAt = nowFull();
  renderView();
  showToast('success', '已删除', '节点「' + node.name + '」已从流程中移除');
}

// --- 流程改名 ---
function showRenameFlowModal() {
  const flow = getCurrentFlow();
  if (!flow) return;
  showModal('修改流程名称', '<div class="form-group" style="margin-bottom:0"><label class="form-label">流程名称 <span class="required">*</span></label><input class="form-input" type="text" id="renameFlowInput" value="' + escHtml(flow.name) + '" maxlength="30" /></div>', [
    { text: '取消', class: 'btn btn-outlined', onclick: 'closeModal()' },
    { text: '确定', class: 'btn btn-primary', onclick: 'confirmRenameFlow()' }
  ]);
}

function confirmRenameFlow() {
  const flow = getCurrentFlow();
  const input = document.getElementById('renameFlowInput');
  const name = (input ? input.value : '').trim();
  if (!name) { showToast('error', '名称不能为空', '请输入流程名称'); return; }
  flow.name = name;
  flow.updatedAt = nowFull();
  closeModal();
  renderView();
  showToast('success', '已更新', '流程名称已修改为「' + name + '」');
}

// --- 保存草稿 ---
function saveFlowDraft() {
  const flow = getCurrentFlow();
  if (flow) flow.updatedAt = nowFull();
  renderView();
  showToast('success', '已保存', '草稿已保存');
}

// --- 表单只读预览弹窗 ---
function showFormPreviewModal() {
  const selForm = formList.find(f => f.id === selectedFormId);
  if (!selForm) { showFormSelectModal(); return; }

// --- 打开/关闭配置抽屉 ---
function openNodeConfig(nodeId) {
  const node = workflowNodes.find(n => n.id === nodeId);
  if(!node) return;
  if(node.type !== 'approval' && node.type !== 'cc') {
    showToast('info', '节点配置', node.type === 'start' ? '开始节点无需配置' : '结束节点无需配置');
    return;
  }
  selectedNodeId = nodeId;
  configDrawerNode = node;
  const drawer = document.getElementById('configDrawer');
  const overlay = document.getElementById('configOverlay');
  if(node.type === 'approval') {
    drawer.innerHTML = renderApprovalConfig(node);
  } else if(node.type === 'cc') {
    drawer.innerHTML = renderCcConfig(node);
  }
  drawer.classList.add('open');
  overlay.classList.add('active');
  renderView(); // Update canvas to show selected state
}

function closeConfigDrawer() {
  document.getElementById('configDrawer').classList.remove('open');
  document.getElementById('configOverlay').classList.remove('active');
  selectedNodeId = null;
  configDrawerNode = null;
  if(currentView === 'designer') renderView();
}

    html += '</div>';

// --- 发布校验 ---
// 上游已定义参数的前缀（开始节点 trigger_1 + 各节点编码输出）
function getDefinedParamPrefixes() {
  const prefixes = ['trigger_1'];
  workflowNodes.forEach(n => { if (n.code) prefixes.push(n.code); });
  return prefixes;
}

// 从表达式 ${xxx.yyy} 中提取引用并返回未定义的参数名（无问题返回 null）
function findUndefinedParamRef(expr) {
  if (!expr) return null;
  const matches = [...String(expr).matchAll(/\$\{([^}]+)\}/g)];
  if (!matches.length) return null;
  const prefixes = getDefinedParamPrefixes();
  for (const m of matches) {
    const ref = m[1].trim();
    const prefix = ref.split('.')[0];
    if (!prefixes.includes(prefix)) return ref;
  }
  return null;
}

function showPublishValidation() {
  let errors = [];
  if(!selectedFormId) errors.push('审批流未选择申请表单');
  workflowNodes.forEach(n => {
    if(n.type === 'approval') {
      if(!n.config.mode) errors.push('审批节点「'+n.name+'」未选择审批模式');
      if(n.config.approverType === 'fixed' && (!n.config.approvers || n.config.approvers.length === 0)) errors.push('审批节点「'+n.name+'」未指定审批人');
      if(n.config.mode === 'single' && n.config.approverType === 'fixed' && n.config.approvers.length > 1) errors.push('审批节点「'+n.name+'」单人模式只能指定 1 位审批人');
      if(n.config.rejectBehavior === 'rollback') {
        if(!n.config.rollbackTarget) errors.push('审批节点「'+n.name+'」请选择回退目标节点');
        else if(!workflowNodes.some(x => x.id === n.config.rollbackTarget)) errors.push('审批节点「'+n.name+'」的回退目标节点已被删除，请重新选择');
      }
      // 第 6 条：参数引用不存在
      if(n.config.approverType === 'param') {
        const bad = findUndefinedParamRef(n.config.paramRef);
        if(bad) errors.push('审批节点「'+n.name+'」引用了未定义的参数 ['+bad+']');
        else if(!n.config.paramRef) errors.push('审批节点「'+n.name+'」未指定审批人');
      }
    }
    if(n.type === 'cc') {
      if(n.config.recipientsType === 'param') {
        const bad = findUndefinedParamRef(n.config.recipientsParamRef);
        if(bad) errors.push('抄送节点「'+n.name+'」引用了未定义的参数 ['+bad+']');
        else if(!n.config.recipientsParamRef) errors.push('抄送节点「'+n.name+'」未指定抄送人');
      } else if(!n.config.recipients || n.config.recipients.length === 0) {
        errors.push('抄送节点「'+n.name+'」未指定抄送人');
      }
    }
  });
  if(errors.length === 0) {
    const flow = getCurrentFlow();
    if (flow) { flow.status = 'published'; flow.updatedAt = nowFull(); }
    renderView();
    showToast('success', '发布成功', '审批流已发布，版本 v1');
    showModal('发布成功', '<p>流程已发布，是否立即发起一次申请体验完整流程？</p><p style="margin-top:8px;font-size:13px;color:var(--md-on-surface-variant)">发起后可在「我的审批 - 我发起的」中跟踪审批进度。</p>', [
      { text: '稍后再说', class: 'btn btn-outlined', onclick: 'closeModal()' },
      { text: '立即发起', class: 'btn btn-primary', onclick: 'closeModal();initiateFromFlow(' + (flow ? flow.id : 0) + ')' }
    ]);
  } else {
    let bodyHtml = '<div class="validation-error" style="margin-bottom:8px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg><div class="validation-error-text">发布失败，存在 '+errors.length+' 个错误：</div></div>';
    errors.forEach(e => { bodyHtml += '<div style="font-size:13px;color:var(--md-error);padding:4px 0;padding-left:16px">• '+escHtml(e)+'</div>'; });
    showModal('发布校验', bodyHtml, [{text:'知道了', class:'btn btn-primary', onclick:'closeModal()'}]);
  }
}

  const p = document.getElementById('demoNavPanel');

function demoJump(t, id) {
  document.getElementById('demoNavPanel').classList.remove('open');
  if (t === 'action') {
    if (id === 'initiate') { openInitiateForm(); return; }
    if (id === 'notif') {
      // 延迟打开，避免本次点击冒泡到 document 后又把面板关掉
      setTimeout(() => { const p = document.getElementById('notifPanel'); if (!p.classList.contains('open')) { p.classList.add('open'); renderNotifPanel(); } }, 50);
      return;
    }
    return;
  }
  if (t === 'flow') { openFlowDesigner(id); return; }
  const map = {
    pending: { list: approvalData.pending, view: 'approver-detail' },
    processed: { list: approvalData.processed, view: 'processed-detail' },
    initiated: { list: approvalData.initiated, view: 'initiator-detail' },
    cc: { list: approvalData.cc, view: 'cc-detail' }
  };
  const m = map[t];
  const rec = m && m.list.find(x => x.id === id);
  if (!rec) { showToast('info', '演示导航', '该记录已在本次会话中被操作，刷新页面可复原'); return; }
  activeTab = t; currentDetailData = rec; currentView = m.view; submitBannerVisible = false;
  closeAddNodeMenu(); closeConfigDrawer();
  document.getElementById('navDesigner').classList.remove('active');
  document.getElementById('navApproval').classList.add('active');
  renderView();
}
