<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Beaver - 审批流</title>
  <meta name="description" content="Beaver 审批流 - 审批流程管理与操作原型" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Roboto+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
/* ============================================
   Beaver - 审批流原型
   Design System (from style.css / designer.css)
   ============================================ */
:root {
  --md-primary: #6750A4;
  --md-on-primary: #FFFFFF;
  --md-primary-container: #F0EBFF;
  --md-on-primary-container: #21005D;
  --md-secondary: #5F6368;
  --md-on-secondary: #FFFFFF;
  --md-secondary-container: #E8EAED;
  --md-error: #D93025;
  --md-on-error: #FFFFFF;
  --md-error-container: #FCE8E6;
  --md-surface: #FFFFFF;
  --md-surface-dim: #E8EAED;
  --md-surface-container-low: #F8F9FA;
  --md-surface-container: #F1F3F5;
  --md-surface-container-high: #E8EAED;
  --md-surface-container-highest: #DADCE0;
  --md-content-bg: #F8F9FA;
  --md-on-surface: #1F1F1F;
  --md-on-surface-variant: #5F6368;
  --md-outline: #9AA0A6;
  --md-outline-variant: #E0E3E7;
  --md-success: #188038;
  --md-success-container: #E6F4EA;
  --md-warning: #E37400;
  --md-warning-container: #FEF7E0;
  --md-info: #1A73E8;
  --md-info-container: #E8F0FE;
  --md-scrim: rgba(0,0,0,0.25);
  --color-primary: var(--md-primary);
  --color-primary-hover: #5B44A0;
  --color-primary-light: var(--md-primary-container);
  --color-primary-subtle: rgba(103,80,164,0.06);
  --color-primary-muted: rgba(103,80,164,0.10);
  --color-bg-page: #F8F9FA;
  --color-bg-sidebar: #FFFFFF;
  --color-bg-card: #FFFFFF;
  --color-text-primary: var(--md-on-surface);
  --color-text-secondary: var(--md-on-surface-variant);
  --color-text-tertiary: var(--md-outline);
  --color-text-placeholder: #BDC1C6;
  --color-success: var(--md-success);
  --color-success-bg: var(--md-success-container);
  --color-warning: var(--md-warning);
  --color-error: var(--md-error);
  --color-error-bg: var(--md-error-container);
  --color-info: var(--md-info);
  --color-border: var(--md-outline-variant);
  --color-border-focus: var(--md-primary);
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
  --shadow-md: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
  --shadow-lg: 0 4px 6px rgba(0,0,0,0.04), 0 1px 3px rgba(0,0,0,0.06);
  --shadow-xl: 0 8px 16px rgba(0,0,0,0.06), 0 2px 4px rgba(0,0,0,0.04);
  --shadow-modal: 0 16px 48px rgba(0,0,0,0.12), 0 4px 8px rgba(0,0,0,0.04);
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px;
  --space-5:20px; --space-6:24px; --space-8:32px; --space-10:40px;
  --font-family: 'Inter','Roboto',system-ui,-apple-system,sans-serif;
  --font-family-mono: 'Roboto Mono','SF Mono',monospace;
  --font-size-xs:11px; --font-size-sm:12px; --font-size-base:14px;
  --font-size-lg:16px; --font-size-xl:22px; --font-size-2xl:24px;
  --radius-sm:6px; --radius-md:10px; --radius-lg:12px; --radius-xl:14px;
  --radius-full:9999px;
  --transition-fast:150ms cubic-bezier(0.2,0,0,1);
  --transition-base:200ms cubic-bezier(0.2,0,0,1);
  --transition-smooth:300ms cubic-bezier(0.2,0,0,1);
  --header-height:56px;
  --sidebar-width:240px;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html{font-size:var(--font-size-base);-webkit-font-smoothing:antialiased;}
body{font-family:var(--font-family);color:var(--md-on-surface);background:var(--color-bg-page);line-height:1.5;overflow:hidden;}
a{text-decoration:none;color:inherit;}
button{cursor:pointer;font-family:inherit;border:none;background:none;}
input,select,textarea{font-family:inherit;font-size:inherit;}
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--color-border);border-radius:var(--radius-full);}
::-webkit-scrollbar-thumb:hover{background:var(--md-outline);}

/* === App Shell === */
.app-shell{display:flex;height:100vh;width:100vw;overflow:hidden;}

/* Sidebar */
.sidebar{width:var(--sidebar-width);min-width:var(--sidebar-width);background:#fff;border-right:1px solid var(--md-outline-variant);display:flex;flex-direction:column;height:100vh;overflow:hidden;}
.sidebar-header{height:var(--header-height);display:flex;align-items:center;padding:0 var(--space-4) 0 var(--space-5);gap:var(--space-3);flex-shrink:0;}
.sidebar-logo{width:32px;height:32px;background:var(--md-primary);border-radius:var(--radius-lg);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.sidebar-logo svg{width:18px;height:18px;color:var(--md-on-primary);}
.sidebar-brand{font-size:var(--font-size-xl);font-weight:500;color:var(--md-on-surface);}
.sidebar-nav{flex:1;overflow-y:auto;padding:var(--space-2) var(--space-3);}
.nav-section{margin-bottom:var(--space-1);}
.nav-section-title{font-size:var(--font-size-xs);font-weight:500;color:var(--md-on-surface-variant);text-transform:uppercase;letter-spacing:0.05em;padding:var(--space-4) var(--space-4) var(--space-2);}
.nav-item{display:flex;align-items:center;gap:var(--space-3);padding:0 var(--space-4);height:48px;border-radius:var(--radius-sm);color:var(--md-on-surface-variant);font-size:var(--font-size-base);font-weight:400;transition:var(--transition-base);cursor:pointer;user-select:none;position:relative;margin-bottom:2px;}
.nav-item:hover{background:#F1F3F5;color:var(--md-on-surface);}
.nav-item.active{background:var(--color-primary-muted);color:var(--md-primary);font-weight:500;}
.nav-item.active::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:20px;background:var(--md-primary);border-radius:0 4px 4px 0;}
.nav-item svg{width:20px;height:20px;flex-shrink:0;}
.nav-badge{margin-left:auto;background:var(--md-error);color:white;font-size:10px;font-weight:600;min-width:18px;height:18px;border-radius:var(--radius-full);display:flex;align-items:center;justify-content:center;padding:0 5px;}
.sidebar-footer{padding:var(--space-4) var(--space-5);border-top:1px solid var(--md-outline-variant);flex-shrink:0;}
.sidebar-footer-text{font-size:var(--font-size-xs);color:var(--md-on-surface-variant);}

/* Main */
.main-area{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;}
.header{height:var(--header-height);background:#fff;border-bottom:1px solid var(--md-outline-variant);display:flex;align-items:center;justify-content:space-between;padding:0 var(--space-4) 0 var(--space-6);flex-shrink:0;}
.header-left{display:flex;align-items:center;gap:var(--space-2);}
.breadcrumb{display:flex;align-items:center;gap:var(--space-2);font-size:var(--font-size-sm);}
.breadcrumb-item{color:var(--md-on-surface-variant);cursor:pointer;}
.breadcrumb-item.current{color:var(--md-on-surface);font-weight:500;cursor:default;}
.breadcrumb-separator{color:var(--md-outline);font-size:var(--font-size-xs);}
.header-right{display:flex;align-items:center;gap:var(--space-1);}
.header-text-btn{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:var(--radius-full);color:var(--md-on-surface-variant);font-size:var(--font-size-sm);transition:var(--transition-base);white-space:nowrap;}
.header-text-btn:hover{background:rgba(17,24,39,0.06);color:var(--md-on-surface);}
.header-text-btn svg{width:18px;height:18px;flex-shrink:0;}
.header-user{display:flex;align-items:center;gap:var(--space-3);padding-left:var(--space-3);margin-left:var(--space-2);}
.header-avatar{width:32px;height:32px;border-radius:var(--radius-full);background:var(--md-primary);display:flex;align-items:center;justify-content:center;font-size:var(--font-size-sm);font-weight:500;color:var(--md-on-primary);}
.header-username{font-size:var(--font-size-base);font-weight:500;color:var(--md-on-surface);}
.content{flex:1;overflow-y:auto;padding:var(--space-8);background:var(--md-content-bg);}

/* === Buttons === */
.btn{display:inline-flex;align-items:center;gap:var(--space-2);padding:0 var(--space-5);height:40px;border-radius:var(--radius-full);font-size:var(--font-size-base);font-weight:500;transition:var(--transition-base);white-space:nowrap;border:none;cursor:pointer;}
.btn svg{width:18px;height:18px;}
.btn-primary{background:var(--md-primary);color:var(--md-on-primary);}
.btn-primary:hover{background:var(--color-primary-hover);}
.btn-outlined{background:transparent;color:var(--md-primary);border:1px solid var(--md-outline-variant);}
.btn-outlined:hover{background:var(--color-primary-subtle);border-color:var(--md-primary);}
.btn-text{background:transparent;color:var(--md-primary);padding:0 var(--space-3);}
.btn-text:hover{background:var(--color-primary-subtle);}
.btn-sm{height:32px;padding:0 var(--space-3);font-size:var(--font-size-sm);}
.btn-sm svg{width:16px;height:16px;}
.btn-danger{background:transparent;color:var(--md-error);border:1px solid var(--color-border);}
.btn-danger:hover{background:var(--color-error-bg);border-color:var(--md-error);}
.btn-danger-filled{background:var(--md-error);color:var(--md-on-error);}
.btn-danger-filled:hover{background:#C12A1E;}
.btn-icon{width:36px;height:36px;padding:0;border-radius:var(--radius-full);display:inline-flex;align-items:center;justify-content:center;color:var(--md-on-surface-variant);transition:var(--transition-fast);}
.btn-icon:hover{background:rgba(0,0,0,0.06);}
.btn-icon svg{width:18px;height:18px;}
.btn:disabled,.btn.disabled{opacity:0.38;cursor:not-allowed;pointer-events:none;}

/* === Card === */
.card{background:var(--color-bg-card);border-radius:var(--radius-lg);border:1px solid var(--color-border);box-shadow:var(--shadow-sm);}
.card-header{padding:var(--space-5) var(--space-6);border-bottom:1px solid var(--color-border);display:flex;align-items:center;justify-content:space-between;}
.card-body{padding:var(--space-5) var(--space-6);}

/* === Status Badge === */
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:var(--radius-full);font-size:var(--font-size-xs);font-weight:500;}
.badge-success{background:var(--color-success-bg);color:var(--color-success);}
.badge-warning{background:var(--md-warning-container);color:var(--color-warning);}
.badge-info{background:var(--md-info-container);color:var(--color-info);}
.badge-error{background:var(--color-error-bg);color:var(--color-error);}
.badge-neutral{background:var(--md-surface-container);color:var(--md-on-surface-variant);}

/* === Form Controls === */
.form-group{margin-bottom:var(--space-5);}
.form-label{display:block;font-size:var(--font-size-sm);font-weight:500;color:var(--md-on-surface);margin-bottom:var(--space-2);}
.form-label .required{color:var(--md-error);margin-left:2px;}
.form-input{width:100%;height:40px;padding:0 var(--space-3);border:1px solid var(--md-outline-variant);border-radius:var(--radius-sm);font-size:var(--font-size-base);color:var(--md-on-surface);background:var(--md-surface);outline:none;transition:var(--transition-base);}
.form-input:focus{border-color:var(--md-primary);border-width:2px;padding:0 calc(var(--space-3) - 1px);}
.form-input::placeholder{color:var(--color-text-placeholder);}
.form-textarea{width:100%;padding:var(--space-3);border:1px solid var(--md-outline-variant);border-radius:var(--radius-sm);font-size:var(--font-size-base);color:var(--md-on-surface);background:var(--md-surface);outline:none;resize:vertical;transition:var(--transition-base);min-height:80px;}
.form-textarea:focus{border-color:var(--md-primary);border-width:2px;padding:calc(var(--space-3) - 1px);}
.form-hint{font-size:var(--font-size-xs);color:var(--md-on-surface-variant);margin-top:var(--space-1);}
.form-error{font-size:var(--font-size-xs);color:var(--md-error);margin-top:var(--space-1);}

/* === Tabs === */
.tabs-header{display:flex;border-bottom:1px solid var(--md-outline-variant);background:#FAFBFC;}
.tab-item{display:flex;align-items:center;gap:var(--space-2);padding:var(--space-4) var(--space-5);font-size:var(--font-size-base);font-weight:500;color:var(--md-on-surface-variant);cursor:pointer;position:relative;transition:var(--transition-base);white-space:nowrap;}
.tab-item svg{width:18px;height:18px;}
.tab-item:hover{color:var(--md-on-surface);background:rgba(17,24,39,0.03);}
.tab-item.active{color:var(--md-primary);}
.tab-item.active::after{content:'';position:absolute;bottom:0;left:var(--space-4);right:var(--space-4);height:3px;background:var(--md-primary);border-radius:var(--radius-full) var(--radius-full) 0 0;}
.tab-content{padding:var(--space-6);}

/* === Modal === */
.modal-overlay{position:fixed;inset:0;z-index:1000;background:var(--md-scrim);display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:opacity 0.2s,visibility 0.2s;}
.modal-overlay.active{opacity:1;visibility:visible;}
.modal{background:#fff;border-radius:var(--radius-xl);box-shadow:var(--shadow-modal);max-width:560px;width:90%;max-height:80vh;display:flex;flex-direction:column;animation:modalIn 0.25s cubic-bezier(0.2,0,0,1);}
@keyframes modalIn{from{opacity:0;transform:scale(0.95) translateY(-10px);}to{opacity:1;transform:scale(1) translateY(0);}}
.modal-header{padding:var(--space-6);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--color-border);}
.modal-title{font-size:var(--font-size-lg);font-weight:500;color:var(--md-on-surface);}
.modal-body{padding:var(--space-6);overflow-y:auto;flex:1;}
.modal-footer{padding:var(--space-4) var(--space-6);border-top:1px solid var(--color-border);display:flex;justify-content:flex-end;gap:var(--space-3);}

/* === Toast === */
.toast-container{position:fixed;top:var(--space-6);right:var(--space-6);z-index:2000;display:flex;flex-direction:column;gap:var(--space-2);pointer-events:none;}
.toast{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-3) var(--space-5);border-radius:var(--radius-md);background:#fff;box-shadow:var(--shadow-xl);font-size:var(--font-size-sm);color:var(--md-on-surface);animation:toastIn 0.3s ease;pointer-events:auto;max-width:400px;}
.toast.success{border-left:3px solid var(--color-success);}
.toast.error{border-left:3px solid var(--color-error);}
.toast.info{border-left:3px solid var(--color-info);}
@keyframes toastIn{from{opacity:0;transform:translateX(20px);}to{opacity:1;transform:translateX(0);}}

/* === Page Header === */
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--space-6);}
.page-title{font-size:var(--font-size-2xl);font-weight:400;color:var(--md-on-surface);}

/* === Empty State === */
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:64px var(--space-8);text-align:center;}
.empty-state-icon{width:80px;height:80px;border-radius:var(--radius-xl);background:var(--md-surface-container);display:flex;align-items:center;justify-content:center;margin-bottom:var(--space-5);}
.empty-state-icon svg{width:40px;height:40px;color:var(--md-outline);}
.empty-state-title{font-size:var(--font-size-lg);font-weight:500;color:var(--md-on-surface);margin-bottom:var(--space-2);}
.empty-state-desc{font-size:var(--font-size-sm);color:var(--md-on-surface-variant);margin-bottom:var(--space-6);max-width:360px;}

/* ============================================
   审批记录列表
   ============================================ */
.approval-list{display:flex;flex-direction:column;gap:var(--space-3);}
.approval-item{background:#fff;border-radius:var(--radius-lg);border:1px solid var(--color-border);padding:var(--space-5);transition:var(--transition-base);cursor:pointer;position:relative;}
.approval-item:hover{box-shadow:var(--shadow-md);border-color:var(--md-primary);}
.approval-item-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--space-3);}
.approval-item-title{font-size:var(--font-size-lg);font-weight:500;color:var(--md-on-surface);}
.approval-item-meta{display:flex;align-items:center;gap:var(--space-4);font-size:var(--font-size-xs);color:var(--md-outline);margin-bottom:var(--space-3);}
.approval-item-meta svg{width:14px;height:14px;}
.approval-item-meta-item{display:flex;align-items:center;gap:4px;}
.approval-item-summary{display:flex;flex-wrap:wrap;gap:var(--space-4);font-size:var(--font-size-sm);color:var(--md-on-surface-variant);}
.approval-item-summary-item{display:flex;flex-direction:column;gap:2px;}
.approval-item-summary-label{font-size:var(--font-size-xs);color:var(--md-outline);}
.approval-item-actions{display:flex;gap:var(--space-2);margin-top:var(--space-4);}

/* ============================================
   审批详情页
   ============================================ */
.detail-page{max-width:800px;margin:0 auto;}
.detail-back{display:flex;align-items:center;gap:var(--space-2);color:var(--md-on-surface-variant);font-size:var(--font-size-sm);cursor:pointer;margin-bottom:var(--space-5);transition:var(--transition-base);}
.detail-back:hover{color:var(--md-primary);}
.detail-back svg{width:18px;height:18px;}
.detail-header{margin-bottom:var(--space-6);}
.detail-title{font-size:var(--font-size-2xl);font-weight:500;color:var(--md-on-surface);display:flex;align-items:center;gap:var(--space-3);}
.detail-subtitle{font-size:var(--font-size-sm);color:var(--md-on-surface-variant);margin-top:var(--space-2);}

/* 申请信息卡片 */
.info-card{background:#fff;border-radius:var(--radius-lg);border:1px solid var(--color-border);margin-bottom:var(--space-6);}
.info-card-title{padding:var(--space-5) var(--space-6);border-bottom:1px solid var(--color-border);font-size:var(--font-size-base);font-weight:600;color:var(--md-on-surface);}
.info-card-body{padding:var(--space-5) var(--space-6);}
.info-field{display:flex;padding:var(--space-3) 0;border-bottom:1px solid var(--md-surface-container);}
.info-field:last-child{border-bottom:none;}
.info-field-label{width:140px;min-width:140px;font-size:var(--font-size-sm);color:var(--md-on-surface-variant);font-weight:500;}
.info-field-value{flex:1;font-size:var(--font-size-base);color:var(--md-on-surface);}

/* 审批流程进度 */
.timeline{padding:var(--space-2) 0;}
.timeline-node{position:relative;padding-left:32px;padding-bottom:var(--space-6);}
.timeline-node:last-child{padding-bottom:0;}
.timeline-node::before{content:'';position:absolute;left:11px;top:24px;bottom:0;width:2px;background:var(--md-outline-variant);}
.timeline-node:last-child::before{display:none;}
.timeline-dot{position:absolute;left:0;top:2px;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;}
.timeline-dot.start{background:var(--md-success-container);color:var(--md-success);}
.timeline-dot.approved{background:var(--md-success-container);color:var(--md-success);}
.timeline-dot.rejected{background:var(--color-error-bg);color:var(--md-error);}
.timeline-dot.current{background:var(--md-primary-container);color:var(--md-primary);box-shadow:0 0 0 3px rgba(103,80,164,0.2);}
.timeline-dot.pending{background:var(--md-surface-container);color:var(--md-outline);}
.timeline-dot.skipped{background:var(--md-surface-container);color:var(--md-outline);}
.timeline-dot.transferred{background:var(--md-info-container);color:var(--md-info);}
.timeline-dot.end-approved{background:var(--md-success-container);color:var(--md-success);}
.timeline-dot.end-rejected{background:var(--color-error-bg);color:var(--md-error);}
.timeline-node-title{font-size:var(--font-size-sm);font-weight:600;color:var(--md-on-surface);margin-bottom:var(--space-1);}
.timeline-node-status{font-size:var(--font-size-xs);color:var(--md-on-surface-variant);margin-bottom:var(--space-2);}

/* 审批记录行 */
.approval-record{padding:var(--space-2) 0 var(--space-2) var(--space-4);border-left:2px solid var(--md-outline-variant);margin-left:var(--space-2);margin-top:var(--space-2);}
.approval-record:last-child{border-left-color:transparent;}
.approval-record-header{display:flex;align-items:center;gap:var(--space-2);font-size:var(--font-size-sm);margin-bottom:2px;}
.approval-record-name{font-weight:500;color:var(--md-on-surface);}
.approval-record-status{font-weight:500;font-size:var(--font-size-xs);padding:1px 8px;border-radius:var(--radius-full);}
.approval-record-status.s-approved{background:var(--color-success-bg);color:var(--color-success);}
.approval-record-status.s-rejected{background:var(--color-error-bg);color:var(--md-error);}
.approval-record-status.s-pending{background:var(--md-surface-container);color:var(--md-on-surface-variant);}
.approval-record-status.s-skipped{background:var(--md-surface-container);color:var(--md-outline);}
.approval-record-status.s-transferred{background:var(--md-info-container);color:var(--md-info);}
.approval-record-status.s-auto{background:var(--md-primary-container);color:var(--md-primary);}
.approval-record-time{font-size:var(--font-size-xs);color:var(--md-outline);}
.approval-record-comment{font-size:var(--font-size-sm);color:var(--md-on-surface-variant);margin-top:2px;font-style:italic;}
.approval-record-note{font-size:var(--font-size-xs);color:var(--md-outline);margin-top:2px;}

/* 轮次分隔 */
.round-divider{display:flex;align-items:center;gap:var(--space-3);margin:var(--space-4) 0;padding-left:32px;}
.round-divider-line{flex:1;height:1px;background:var(--md-outline-variant);}
.round-divider-text{font-size:var(--font-size-xs);color:var(--md-on-surface-variant);font-weight:500;white-space:nowrap;}

/* 操作区 */
.action-area{background:#fff;border-radius:var(--radius-lg);border:1px solid var(--color-border);padding:var(--space-5) var(--space-6);margin-top:var(--space-6);}
.action-area-title{font-size:var(--font-size-sm);font-weight:600;color:var(--md-on-surface);margin-bottom:var(--space-4);}
.action-comment{width:100%;min-height:80px;padding:var(--space-3);border:1px solid var(--md-outline-variant);border-radius:var(--radius-sm);font-size:var(--font-size-base);color:var(--md-on-surface);outline:none;resize:vertical;transition:var(--transition-base);margin-bottom:var(--space-4);}
.action-comment:focus{border-color:var(--md-primary);border-width:2px;padding:calc(var(--space-3) - 1px);}
.action-buttons{display:flex;gap:var(--space-3);flex-wrap:wrap;}

/* 已处理提示 */
.processed-notice{background:var(--md-surface-container);border-radius:var(--radius-md);padding:var(--space-4) var(--space-5);display:flex;align-items:center;gap:var(--space-3);margin-bottom:var(--space-4);}
.processed-notice svg{width:20px;height:20px;color:var(--md-on-surface-variant);flex-shrink:0;}
.processed-notice-text{font-size:var(--font-size-sm);color:var(--md-on-surface-variant);}

.hidden{display:none!important;}

/* ============================================
   表格样式 (匹配主原型 style.css 规范)
   ============================================ */
.table-card{background:#fff;border-radius:var(--radius-lg);border:1px solid var(--color-border);overflow:hidden;}
.table-wrapper{overflow-x:auto;}
.data-table{width:100%;border-collapse:collapse;font-size:var(--font-size-sm);}
.data-table th{padding:var(--space-3) var(--space-4);text-align:left;font-weight:500;color:var(--md-on-surface-variant);border-bottom:1px solid var(--color-border);background:var(--md-surface-container-low);white-space:nowrap;}
.data-table td{padding:var(--space-3) var(--space-4);border-bottom:1px solid var(--md-outline-variant);color:var(--md-on-surface);vertical-align:middle;}
.data-table tbody tr{transition:var(--transition-fast);cursor:pointer;}
.data-table tbody tr:hover{background:var(--color-primary-subtle);}
.data-table tbody tr:last-child td{border-bottom:none;}
.col-header{cursor:pointer;user-select:none;display:inline-flex;align-items:center;gap:4px;}
.col-header:hover{color:var(--md-primary);}
.sort-icon{font-size:10px;opacity:0.6;}
.table-actions{display:flex;gap:4px;align-items:center;}
.table-action-btn{width:30px;height:30px;border-radius:var(--radius-sm);display:inline-flex;align-items:center;justify-content:center;color:var(--md-on-surface-variant);transition:var(--transition-fast);border:none;background:none;}
.table-action-btn:hover{background:rgba(0,0,0,0.06);color:var(--md-on-surface);}
.table-action-btn svg{width:16px;height:16px;}
.table-action-btn.danger:hover{background:var(--color-error-bg);color:var(--md-error);}
.ds-name-cell{display:flex;flex-direction:column;gap:2px;}
.ds-name{font-size:var(--font-size-sm);font-weight:500;color:var(--md-on-surface);}
.ds-desc{font-size:var(--font-size-xs);color:var(--md-outline);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:300px;}

/* 状态徽章 (表格内) */
.st-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:var(--radius-full);font-size:var(--font-size-xs);font-weight:500;white-space:nowrap;}
.st-badge.st-pending{background:var(--md-warning-container);color:var(--color-warning);}
.st-badge.st-approved{background:var(--color-success-bg);color:var(--color-success);}
.st-badge.st-rejected{background:var(--color-error-bg);color:var(--color-error);}
.st-badge.st-transferred{background:var(--md-info-container);color:var(--color-info);}
.st-badge.st-skipped{background:var(--md-surface-container);color:var(--md-outline);}
.st-badge.st-in-progress{background:var(--md-warning-container);color:var(--color-warning);}
.st-badge.st-withdrawn{background:var(--md-surface-container);color:var(--md-on-surface-variant);}

/* 筛选栏 */
.filter-bar{display:flex;align-items:center;gap:var(--space-3);margin-bottom:var(--space-4);flex-wrap:wrap;}
.filter-search{display:flex;align-items:center;gap:var(--space-2);background:#fff;border:1px solid var(--md-outline-variant);border-radius:var(--radius-full);padding:0 var(--space-4);height:40px;flex:1;max-width:320px;transition:var(--transition-base);}
.filter-search:focus-within{border-color:var(--md-primary);}
.filter-search svg{width:18px;height:18px;color:var(--md-outline);flex-shrink:0;}
.filter-search input{border:none;outline:none;flex:1;font-size:var(--font-size-sm);background:transparent;color:var(--md-on-surface);}
.filter-search input::placeholder{color:var(--color-text-placeholder);}
.filter-search .search-clear-btn{width:18px;height:18px;border:none;background:none;color:var(--md-outline);cursor:pointer;font-size:16px;line-height:1;display:flex;align-items:center;justify-content:center;}
.filter-select{height:40px;padding:0 var(--space-3);border:1px solid var(--md-outline-variant);border-radius:var(--radius-sm);font-size:var(--font-size-sm);color:var(--md-on-surface);background:#fff;outline:none;cursor:pointer;transition:var(--transition-base);}
.filter-select:focus{border-color:var(--md-primary);}

/* 分页 */
.pagination{display:flex;align-items:center;justify-content:space-between;padding:var(--space-4) var(--space-5);border-top:1px solid var(--md-outline-variant);}
.pagination-info{display:flex;align-items:center;gap:var(--space-3);font-size:var(--font-size-sm);color:var(--md-on-surface-variant);}
.pagination-size{display:flex;align-items:center;gap:4px;}
.pagination-size select{border:1px solid var(--md-outline-variant);border-radius:var(--radius-sm);padding:2px 6px;font-size:var(--font-size-sm);outline:none;}
.pagination-controls{display:flex;gap:4px;align-items:center;}
.pagination-btn{min-width:32px;height:32px;border-radius:var(--radius-sm);display:inline-flex;align-items:center;justify-content:center;font-size:var(--font-size-sm);color:var(--md-on-surface-variant);border:1px solid transparent;transition:var(--transition-fast);cursor:pointer;background:none;}
.pagination-btn:hover:not(:disabled){background:var(--md-surface-container);}
.pagination-btn.active{background:var(--md-primary);color:var(--md-on-primary);font-weight:500;}
.pagination-btn:disabled{opacity:0.38;cursor:not-allowed;}
.pagination-btn svg{width:16px;height:16px;}

/* ============================================
   设计器 / 流程编排
   ============================================ */
.designer-view{display:flex;flex-direction:column;height:100%;}
.designer-toolbar{display:flex;align-items:center;justify-content:space-between;padding:var(--space-3) var(--space-6);background:#fff;border-bottom:1px solid var(--color-border);flex-shrink:0;}
.designer-toolbar-left{display:flex;align-items:center;gap:var(--space-3);}
.designer-toolbar-right{display:flex;align-items:center;gap:var(--space-2);}
.designer-canvas{flex:1;overflow-y:auto;background:var(--md-surface-container-low);padding:var(--space-10) var(--space-8);position:relative;background-image:radial-gradient(circle, var(--md-outline-variant) 1px, transparent 1px);background-size:20px 20px;}

/* 节点卡片（垂直流程图） */
.node-card{position:relative;background:#fff;border:2px solid var(--color-border);border-radius:var(--radius-lg);box-shadow:var(--shadow-md);width:320px;cursor:pointer;transition:var(--transition-base);user-select:none;}
.node-card:hover{border-color:var(--md-primary);box-shadow:var(--shadow-lg);transform:translateY(-1px);}
.node-card.selected{border-color:var(--md-primary);box-shadow:0 0 0 3px rgba(103,80,164,0.15);}
.node-card-header{display:flex;align-items:center;gap:var(--space-2);padding:var(--space-3) var(--space-4);border-bottom:1px solid var(--md-outline-variant);}
.node-card-icon{width:28px;height:28px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.node-card-icon svg{width:16px;height:16px;}
.node-card-icon.start{background:var(--color-success-bg);color:var(--color-success);}
.node-card-icon.approval{background:var(--md-primary-container);color:var(--md-primary);}
.node-card-icon.cc{background:var(--md-info-container);color:var(--color-info);}
.node-card-icon.end{background:var(--md-surface-container);color:var(--md-on-surface-variant);}
.node-card-title{font-size:var(--font-size-sm);font-weight:500;color:var(--md-on-surface);}
.node-card-body{padding:var(--space-2) var(--space-4) var(--space-3);}
.node-card-summary{font-size:var(--font-size-xs);color:var(--md-on-surface-variant);}
.node-card-summary.warning{color:var(--color-warning);}
.node-card-code{font-size:10px;color:var(--md-outline);font-family:var(--font-family-mono);padding:0 var(--space-4) var(--space-2);}

/* 节点删除按钮 */
.node-card-del{position:absolute;top:-9px;right:-9px;width:22px;height:22px;border-radius:50%;background:#fff;border:1px solid var(--md-outline-variant);color:var(--md-on-surface-variant);display:none;align-items:center;justify-content:center;cursor:pointer;box-shadow:var(--shadow-sm);z-index:2;font-size:0;}
.node-card-del svg{width:12px;height:12px;}
.node-card-del:hover{background:var(--color-error-bg);border-color:var(--md-error);color:var(--md-error);}
.node-card:hover .node-card-del{display:flex;}

/* 垂直连线 + 插入节点按钮 */
.flow-column{display:flex;flex-direction:column;align-items:center;padding-bottom:var(--space-10);}
.flow-connector{display:flex;flex-direction:column;align-items:center;position:relative;}
.flow-connector-line{width:2px;height:22px;background:var(--md-outline-variant);}
.flow-connector-line.arrow{position:relative;}
.flow-connector-line.arrow::after{content:'';position:absolute;left:-4px;bottom:0;border:5px solid transparent;border-top-color:var(--md-outline-variant);}
.flow-add-btn{width:26px;height:26px;border-radius:50%;background:#fff;border:1px solid var(--md-outline-variant);color:var(--md-primary);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:var(--transition-fast);box-shadow:var(--shadow-sm);position:relative;z-index:2;}
.flow-add-btn svg{width:14px;height:14px;}
.flow-add-btn:hover{transform:scale(1.25);background:var(--md-primary);border-color:var(--md-primary);color:var(--md-on-primary);box-shadow:var(--shadow-md);}

/* 插入节点浮层菜单 */
.add-node-menu{position:fixed;background:#fff;border:1px solid var(--color-border);border-radius:var(--radius-lg);box-shadow:var(--shadow-modal);padding:var(--space-2);width:220px;z-index:950;}
.add-node-menu-item{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-2) var(--space-3);border-radius:var(--radius-sm);cursor:pointer;transition:var(--transition-fast);}
.add-node-menu-item:hover{background:var(--color-primary-subtle);}
.add-node-menu-item.disabled{opacity:0.5;cursor:not-allowed;}
.add-node-menu-item.disabled:hover{background:none;}
.add-node-menu-item .node-card-icon{width:26px;height:26px;}
.add-node-menu-item .node-card-icon svg{width:14px;height:14px;}
.add-node-menu-label{font-size:var(--font-size-sm);color:var(--md-on-surface);}
.add-node-menu-note{font-size:10px;color:var(--md-outline);margin-top:1px;}

/* ============================================
   配置面板 (右侧抽屉)
   ============================================ */
.config-drawer{position:fixed;top:0;right:0;width:420px;height:100vh;background:#fff;box-shadow:var(--shadow-modal);z-index:900;display:flex;flex-direction:column;transform:translateX(100%);transition:transform 0.3s cubic-bezier(0.2,0,0,1);}
.config-drawer.open{transform:translateX(0);}
.config-drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.15);z-index:899;opacity:0;visibility:hidden;transition:opacity 0.3s,visibility 0.3s;}
.config-drawer-overlay.active{opacity:1;visibility:visible;}
.config-header{padding:var(--space-5) var(--space-6);border-bottom:1px solid var(--color-border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.config-header-info{display:flex;align-items:center;gap:var(--space-3);}
.config-header-icon{width:40px;height:40px;border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.config-header-icon svg{width:22px;height:22px;}
.config-header-icon.approval{background:var(--md-primary-container);color:var(--md-primary);}
.config-header-icon.cc{background:var(--md-info-container);color:var(--color-info);}
.config-header-text{display:flex;flex-direction:column;gap:2px;}
.config-header-name{font-size:var(--font-size-lg);font-weight:500;color:var(--md-on-surface);}
.config-header-code{font-size:var(--font-size-xs);color:var(--md-outline);font-family:var(--font-family-mono);}
.config-body{flex:1;overflow-y:auto;padding:var(--space-5) var(--space-6);}
.config-section{margin-bottom:var(--space-6);}
.config-section-title{font-size:var(--font-size-sm);font-weight:600;color:var(--md-on-surface);margin-bottom:var(--space-3);padding-bottom:var(--space-2);border-bottom:1px solid var(--md-outline-variant);display:flex;align-items:center;gap:var(--space-2);}
.config-section-title svg{width:16px;height:16px;color:var(--md-on-surface-variant);}

/* Toggle 开关 */
.toggle{position:relative;display:inline-block;width:40px;height:22px;flex-shrink:0;}
.toggle input{opacity:0;width:0;height:0;}
.toggle-slider{position:absolute;cursor:pointer;inset:0;background:var(--md-surface-container-highest);border-radius:var(--radius-full);transition:var(--transition-base);}
.toggle-slider::before{content:'';position:absolute;height:16px;width:16px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:var(--transition-base);box-shadow:0 1px 2px rgba(0,0,0,0.2);}
.toggle input:checked + .toggle-slider{background:var(--md-primary);}
.toggle input:checked + .toggle-slider::before{transform:translateX(18px);}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:var(--space-3) 0;}
.toggle-row-label{font-size:var(--font-size-sm);color:var(--md-on-surface);font-weight:500;}
.toggle-row-desc{font-size:var(--font-size-xs);color:var(--md-on-surface-variant);margin-top:2px;}

/* 单选卡片组 */
.radio-card-group{display:flex;flex-direction:column;gap:var(--space-2);}
.radio-card{display:flex;align-items:flex-start;gap:var(--space-3);padding:var(--space-3) var(--space-4);border:1px solid var(--md-outline-variant);border-radius:var(--radius-md);cursor:pointer;transition:var(--transition-base);}
.radio-card:hover{border-color:var(--md-primary);background:var(--color-primary-subtle);}
.radio-card.selected{border-color:var(--md-primary);background:var(--color-primary-muted);}
.radio-card-radio{width:18px;height:18px;border:2px solid var(--md-outline);border-radius:50%;flex-shrink:0;margin-top:1px;transition:var(--transition-base);position:relative;}
.radio-card.selected .radio-card-radio{border-color:var(--md-primary);}
.radio-card.selected .radio-card-radio::after{content:'';position:absolute;inset:3px;background:var(--md-primary);border-radius:50%;}
.radio-card-content{flex:1;}
.radio-card-title{font-size:var(--font-size-sm);font-weight:500;color:var(--md-on-surface);}
.radio-card-desc{font-size:var(--font-size-xs);color:var(--md-on-surface-variant);margin-top:2px;line-height:1.4;}

/* 人员选择器输入框 */
.person-picker{display:flex;align-items:center;gap:var(--space-2);height:40px;padding:0 var(--space-3);border:1px solid var(--md-outline-variant);border-radius:var(--radius-sm);cursor:pointer;transition:var(--transition-base);}
.person-picker:hover{border-color:var(--md-primary);}
.person-picker svg{width:18px;height:18px;color:var(--md-outline);flex-shrink:0;}
.person-picker-text{flex:1;font-size:var(--font-size-sm);color:var(--color-text-placeholder);}
.person-picker-text.has-value{color:var(--md-on-surface);}
.person-tag{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;background:var(--color-primary-muted);color:var(--md-primary);border-radius:var(--radius-full);font-size:var(--font-size-xs);font-weight:500;margin-right:4px;}
.person-tag .remove{cursor:pointer;opacity:0.6;}
.person-tag .remove:hover{opacity:1;}

/* 输出参数表 */
.param-table{width:100%;font-size:var(--font-size-xs);border-collapse:collapse;}
.param-table th{padding:var(--space-2) var(--space-3);text-align:left;color:var(--md-on-surface-variant);font-weight:500;border-bottom:1px solid var(--md-outline-variant);background:var(--md-surface-container-low);}
.param-table td{padding:var(--space-2) var(--space-3);color:var(--md-on-surface);border-bottom:1px solid var(--md-outline-variant);}
.param-table code{font-family:var(--font-family-mono);color:var(--md-primary);font-size:11px;}

/* 卡片摘要预览 */
.summary-preview{display:flex;align-items:center;gap:var(--space-2);padding:var(--space-3) var(--space-4);background:var(--md-surface-container-low);border-radius:var(--radius-md);border:1px dashed var(--md-outline-variant);}
.summary-preview-label{font-size:var(--font-size-xs);color:var(--md-on-surface-variant);font-weight:500;}
.summary-preview-text{font-size:var(--font-size-xs);color:var(--md-on-surface);}
.summary-preview.warning .summary-preview-text{color:var(--color-warning);}

/* 校验错误提示 */
.validation-error{display:flex;align-items:flex-start;gap:var(--space-2);padding:var(--space-3) var(--space-4);background:var(--color-error-bg);border-radius:var(--radius-md);border-left:3px solid var(--md-error);margin-bottom:var(--space-3);}
.validation-error svg{width:16px;height:16px;color:var(--md-error);flex-shrink:0;margin-top:1px;}
.validation-error-text{font-size:var(--font-size-xs);color:var(--md-error);line-height:1.4;}

/* 表单选择预览 */
.form-select-bar{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-3) var(--space-4);background:var(--md-primary-container);border-radius:var(--radius-md);border:1px solid rgba(103,80,164,0.15);}
.form-select-bar-label{font-size:var(--font-size-sm);font-weight:500;color:var(--md-on-primary-container);}
.form-select-bar-name{font-size:var(--font-size-sm);color:var(--md-on-primary-container);padding:2px 10px;background:rgba(103,80,164,0.1);border-radius:var(--radius-full);}
.form-select-bar-btn{margin-left:auto;}
.form-preview-card{background:#fff;border:1px solid var(--md-outline-variant);border-radius:var(--radius-md);overflow:hidden;}
.form-preview-header{padding:var(--space-3) var(--space-4);background:var(--md-surface-container-low);border-bottom:1px solid var(--md-outline-variant);font-size:var(--font-size-sm);font-weight:500;color:var(--md-on-surface);display:flex;align-items:center;justify-content:space-between;}
.form-field-row{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-2) var(--space-4);border-bottom:1px solid var(--md-outline-variant);}
.form-field-row:last-child{border-bottom:none;}
.form-field-name{font-size:var(--font-size-sm);color:var(--md-on-surface);flex:1;}
.form-field-type{font-size:var(--font-size-xs);padding:2px 8px;border-radius:var(--radius-full);background:var(--md-surface-container);color:var(--md-on-surface-variant);}
.form-field-required{color:var(--md-error);font-size:var(--font-size-xs);}

/* 节点说明折叠 */
.node-help{padding:var(--space-3) var(--space-4);background:var(--md-info-container);border-radius:var(--radius-md);font-size:var(--font-size-xs);color:var(--md-on-surface);line-height:1.5;display:none;}
.node-help.open{display:block;}
.node-help-toggle{font-size:var(--font-size-xs);color:var(--color-info);cursor:pointer;display:inline-flex;align-items:center;gap:4px;margin-bottom:var(--space-2);}
.node-help-toggle:hover{text-decoration:underline;}

/* 设计器底部操作栏 */
.designer-footer{display:flex;align-items:center;justify-content:space-between;padding:var(--space-3) var(--space-6);background:#fff;border-top:1px solid var(--color-border);flex-shrink:0;}

/* ============================================
   增量补充样式
   ============================================ */
/* 发起表单必填校验 shake */

// 获取节点的卡片摘要
function getNodeSummary(node) {
  if (node.type === 'start') return node.summary;
  if (node.type === 'end') return node.summary;
  if (node.type === 'approval') {
    const c = node.config;
    if (!c.mode || (c.approverType === 'fixed' && (!c.approvers || c.approvers.length === 0))) return '⚠ 未完成配置';
    const modeLabel = { single: '单人审批', countersign: '会签', 'or-sign': '或签' }[c.mode] || '';
    if (c.approverType === 'fixed') return `${modeLabel} · ${c.approvers.join('、')}`;
    if (c.approverType === 'param') return `${modeLabel} · ${c.paramRef || '未设置'}`;
    if (c.approverType === 'org') return `${modeLabel} · ${c.orgType === 'direct-supervisor' ? '申请人直属上级' : '部门负责人'}`;
    return `${modeLabel}`;
  }
  if (node.type === 'cc') {
    const c = node.config;
    if (c.recipientsType === 'param') {
      return c.recipientsParamRef ? `抄送 · ${c.recipientsParamRef}` : '⚠ 未完成配置';
    }
    if (!c.recipients || c.recipients.length === 0) return '⚠ 未完成配置';
    return `抄送 · ${c.recipients.join('、')}`;
  }
  return '';
}

// --- 渲染主入口 ---
function renderView() {
  // 重建 DOM 前保存搜索框焦点/光标
  const activeEl = document.activeElement;
  let searchRestore = null;
  if (searchFocused && activeEl && activeEl.matches && activeEl.matches('.filter-search input')) {
    searchRestore = { start: activeEl.selectionStart, end: activeEl.selectionEnd };
  }
  const main = document.getElementById('mainContent');
  if (currentView === 'list') {
    document.getElementById('breadcrumbText').textContent = '我的审批';
    main.innerHTML = renderListView();
    main.style.padding = 'var(--space-8)';
  } else if (currentView === 'approver-detail') {
    setDetailBreadcrumb('审批详情');
    main.innerHTML = renderApproverDetail();
    main.style.padding = 'var(--space-8)';
  } else if (currentView === 'initiator-detail') {
    setDetailBreadcrumb('审批详情');
    main.innerHTML = renderInitiatorDetail();
    main.style.padding = 'var(--space-8)';
  } else if (currentView === 'processed-detail') {
    setDetailBreadcrumb('审批详情');
    main.innerHTML = renderProcessedDetail();
    main.style.padding = 'var(--space-8)';
  } else if (currentView === 'cc-detail') {
    setDetailBreadcrumb('审批详情');
    main.innerHTML = renderCcDetail();
    main.style.padding = 'var(--space-8)';
  } else if (currentView === 'initiate-form') {
    setDetailBreadcrumb('发起申请');
    main.innerHTML = renderInitiateForm();
    main.style.padding = 'var(--space-8)';
  } else if (currentView === 'flow-list') {
    document.getElementById('breadcrumbText').innerHTML = '<span class="breadcrumb-item current">流程编排</span>';
    main.innerHTML = renderFlowListView();
    main.style.padding = 'var(--space-8)';
  } else if (currentView === 'designer') {
    document.getElementById('breadcrumbText').innerHTML = '<span class="breadcrumb-item" onclick="switchToDesigner()">流程编排</span><span class="breadcrumb-separator">/</span><span class="breadcrumb-item current">' + escHtml((getCurrentFlow() || {}).name || '设计器') + '</span>';
    main.innerHTML = renderDesignerView();
    main.style.padding = '0';
  }
  // 重建后恢复搜索框焦点和光标
  if (searchRestore) {
    requestAnimationFrame(() => {
      const inp = document.querySelector('.filter-search input');
      if (inp) {
        inp.focus();
        try { inp.setSelectionRange(searchRestore.start, searchRestore.end); } catch (e) { /* ignore */ }
      }
    });
  }
}

function setDetailBreadcrumb(label) {
  document.getElementById('breadcrumbText').innerHTML = '<span class="breadcrumb-item" onclick="backToList()">我的审批</span><span class="breadcrumb-separator">/</span><span class="breadcrumb-item current">' + label + '</span>';
}

// 侧边栏「流程编排」入口：进入审批流列表页
function switchToDesigner() {
  currentView = 'flow-list';
  currentFlowId = null;
  selectedNodeId = null;
  closeAddNodeMenu();
  closeConfigDrawer();
  document.getElementById('navDesigner').classList.add('active');
  document.getElementById('navApproval').classList.remove('active');
  renderView();
}

// 进入某条流程的设计器
function openFlowDesigner(flowId) {
  const flow = flowStore.find(f => f.id === flowId);
  if (!flow) return;
  currentFlowId = flowId;
  workflowNodes = flow.nodes;
  selectedFormId = flow.formId;
  currentView = 'designer';
  selectedNodeId = null;
  closeAddNodeMenu();
  closeConfigDrawer();
  document.getElementById('navDesigner').classList.add('active');
  document.getElementById('navApproval').classList.remove('active');
  renderView();
}

function switchToApproval() {
  currentView = 'list';
  closeAddNodeMenu();
  closeConfigDrawer();
  document.getElementById('navDesigner').classList.remove('active');
  document.getElementById('navApproval').classList.add('active');
  renderView();
}

function backToList() {
  currentView = 'list';
  currentDetailData = null;
  submitBannerVisible = false;
  renderView();
}

// --- 列表视图 ---
function renderListView() {
  const tabs = [
    { key: 'pending', label: '待我审批', count: approvalData.pending.length },
    { key: 'processed', label: '我已审批', count: approvalData.processed.length },
    { key: 'initiated', label: '我发起的', count: approvalData.initiated.length },
    { key: 'cc', label: '抄送我的', count: approvalData.cc.length }
  ];
  let html = `<div class="page-header"><div class="page-title">我的审批</div></div>`;
  html += `<div class="card" style="overflow:hidden;">`;
  html += `<div class="tabs-header">${tabs.map(t =>
    `<div class="tab-item ${activeTab === t.key ? 'active' : ''}" onclick="switchTab('${t.key}')">${t.label}${t.count > 0 ? ` <span style="font-size:11px;background:${t.key==='pending'?'var(--md-error)':'var(--md-surface-container)'};color:${t.key==='pending'?'white':'var(--md-on-surface-variant)'};padding:1px 7px;border-radius:10px;margin-left:4px;">${t.count}</span>` : ''}</div>`
  ).join('')}</div>`;
  html += `<div class="tab-content">${renderTabContent()}</div>`;
  html += `</div>`;
  return html;
}

function switchTab(tab) { activeTab = tab; listSearch = ''; listStatusFilter = 'all'; listPage = 1; renderView(); }

function renderTabContent() {
  if (activeTab === 'pending') return renderPendingList();
  if (activeTab === 'processed') return renderProcessedList();
  if (activeTab === 'initiated') return renderInitiatedList();
  if (activeTab === 'cc') return renderCcList();
  return '';
}

function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// --- 筛选栏 ---
function renderFilterBar(tab, extraHtml) {
  const filterOptions = {
    processed: [{value:'all',label:'全部状态'},{value:'approved',label:'已通过'},{value:'rejected',label:'已拒绝'},{value:'transferred',label:'已转交'},{value:'skipped',label:'已跳过'}],
    initiated: [{value:'all',label:'全部状态'},{value:'in-progress',label:'审批中'},{value:'approved',label:'已通过'},{value:'rejected',label:'已拒绝'},{value:'withdrawn',label:'已撤回'}],
    cc: [{value:'all',label:'全部状态'},{value:'in-progress',label:'审批中'},{value:'approved',label:'已通过'},{value:'rejected',label:'已拒绝'}]
  };
  let html = '<div class="filter-bar">';
  html += '<div class="filter-search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><input type="text" placeholder="搜索申请标题或发起人..." value="'+escHtml(listSearch)+'" oninput="onListSearch(this.value)" oncompositionstart="isComposing=true" oncompositionend="isComposing=false;onListSearch(this.value)" onfocus="searchFocused=true" onblur="searchFocused=false" />'+(listSearch?'<button class="search-clear-btn" onclick="clearListSearch()">×</button>':'')+'</div>';
  if (filterOptions[tab]) html += '<select class="filter-select" onchange="onListStatusFilter(this.value)">'+filterOptions[tab].map(o=>'<option value="'+o.value+'" '+(listStatusFilter===o.value?'selected':'')+'>'+o.label+'</option>').join('')+'</select>';
  if (extraHtml) html += extraHtml;
  html += '</div>';
  return html;
}
// 搜索防抖 + IME 处理
function onListSearch(v){
  if(isComposing)return;
  clearTimeout(searchTimer);
  searchTimer=setTimeout(()=>{listSearch=v;listPage=1;renderView();},300);
}
function clearListSearch(){listSearch='';listPage=1;renderView();}
function onListStatusFilter(val){listStatusFilter=val;listPage=1;renderView();}
function onListPageSize(val){listPageSize=parseInt(val);renderView();}
function goToListPage(p){listPage=p;renderView();}
// 是否处于筛选/搜索状态（区分空态文案）
function hasListFilter(){return !!listSearch || listStatusFilter!=='all';}

// --- 分页 ---
function renderPagination(total,totalPages){
  if(total===0)return'';
  let btns='';for(let i=1;i<=totalPages;i++)btns+='<button class="pagination-btn '+(i===listPage?'active':'')+'" onclick="goToListPage('+i+')">'+i+'</button>';
  return '<div class="pagination"><div class="pagination-info"><span>共 '+total+' 条记录</span><div class="pagination-size"><label>每页</label><select onchange="onListPageSize(this.value)">'+[10,20,50].map(n=>'<option value="'+n+'" '+(listPageSize===n?'selected':'')+'>'+n+'</option>').join('')+'</select><label>条</label></div></div><div class="pagination-controls"><button class="pagination-btn" '+(listPage<=1?'disabled':'')+' onclick="goToListPage('+(listPage-1)+')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg></button>'+btns+'<button class="pagination-btn" '+(listPage>=totalPages?'disabled':'')+' onclick="goToListPage('+(listPage+1)+')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg></button></div></div>';
}

// --- 我发起的 (表格) ---
// 从时间线推导当前待处理人：单人显示「待 xxx 处理」，多人显示「待 xxx 等 N 人处理」
function getPendingApproverText(item) {
  const cur = (item.timeline || []).find(n => n.type === 'node' && n.isCurrent);
  if (!cur || !cur.records) return item.currentStep || '—';
  const waiting = cur.records.filter(r => r.status === '待审批').map(r => r.name.replace('（我）', ''));
  if (!waiting.length) return item.currentStep || '—';
  if (waiting.length === 1) return '待 ' + waiting[0] + ' 处理';
  return '待 ' + waiting[0] + ' 等 ' + waiting.length + ' 人处理';
}

// --- 移动端卡片列表（<=768px 时表格切换为卡片） ---
function renderMobileCards(items, opts) {
  let html = '<div class="mobile-card-list">';
  items.forEach(item => {
    const desc = Object.entries(item.summary).slice(0, 2).map(([k, v]) => k + '：' + v).join(' · ');
    html += '<div class="mobile-approval-card" onclick="' + opts.onclick + '(' + item.id + ')">';
    html += '<div class="mobile-card-top"><span class="mobile-card-title">' + escHtml(item.formName) + '</span><span class="st-badge ' + (opts.badgeClass(item) || '') + '">' + escHtml(opts.badgeText(item)) + '</span></div>';
    html += '<div class="mobile-card-desc">' + escHtml(desc) + '</div>';
    html += '<div class="mobile-card-meta">' + opts.meta(item).filter(Boolean).map(m => '<span>' + escHtml(m) + '</span>').join('') + '</div>';
    html += '</div>';
  });
  html += '</div>';
  return html;
}

function renderEmpty(text) {
  if (hasListFilter()) {
    return `<div class="empty-state"><div class="empty-state-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></div><div class="empty-state-title">没有找到匹配的审批</div><div class="empty-state-desc">试试调整筛选条件</div></div>`;

  return `<div class="empty-state"><div class="empty-state-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg></div><div class="empty-state-title">${text}</div></div>`;
}

// --- 详情页公共渲染：申请信息卡片（含已抄送标签行） ---
function renderFormInfoCard(d) {
  let html = `<div class="info-card"><div class="info-card-title">申请信息</div><div class="info-card-body">`;
  (d.formData || []).forEach(f => { html += `<div class="info-field"><div class="info-field-label">${escHtml(f.label)}</div><div class="info-field-value">${escHtml(f.value)}</div></div>`; });
  html += `</div>`;
  if (d.ccList && d.ccList.length > 0) {
    html += `<div class="cc-tags-row"><span>已抄送给：</span>${d.ccList.map(p => `<span class="person-tag">${escHtml(p)}</span>`).join('')}</div>`;
  }
  html += `</div>`;
  return html;
}

// --- 详情页公共渲染：审批流程进度卡片 ---
function renderTimelineCard(d) {
  let html = `<div class="info-card"><div class="info-card-title">审批流程</div><div class="info-card-body"><div class="timeline">`;
  (d.timeline || []).forEach(node => {
    if (node.type === 'round') {
      html += `<div class="round-divider"><div class="round-divider-line"></div><div class="round-divider-text">── ${node.label} ──</div><div class="round-divider-line"></div></div>`;
      return;
    }
    const dotIcon = getDotIcon(node.dotClass);
    html += `<div class="timeline-node"><div class="timeline-dot ${node.dotClass}">${dotIcon}</div>`;
    html += `<div class="timeline-node-title">${node.title}</div>`;
    html += `<div class="timeline-node-status">${node.status}${node.time ? ' ' + node.time : ''}</div>`;
    if (node.records) node.records.forEach(r => { html += renderApprovalRecord(r); });
    html += `</div>`;
  });
  html += `</div></div></div>`;
  return html;
}

function renderApprovalRecord(r) {
  let html = `<div class="approval-record"><div class="approval-record-header"><span class="approval-record-name">${r.name}</span><span class="approval-record-status ${r.statusClass}">${r.status}</span>${r.time ? `<span class="approval-record-time">${r.time}</span>` : ''}</div>`;
  if (r.comment) html += `<div class="approval-record-comment">"${r.comment}"</div>`;
  if (r.note) html += `<div class="approval-record-note">${r.note}</div>`;
  html += `</div>`;
  return html;
}

function getDotIcon(dotClass) {
  switch (dotClass) {
    case 'start': return '✓';
    case 'approved': case 'end-approved': return '✓';
    case 'rejected': case 'end-rejected': return '✗';
    case 'current': return '●';
    case 'pending': return '○';

    pushNotification('【已撤回】' + d.formName, 'Sukey Wu 已撤回' + d.formName + '，无需操作', null);

// 发起申请表单 (A-01/A-02/A-03)

const initiateFields = [
  { key: 'dest', label: '出差目的地', type: 'select', required: true, options: ['上海', '北京', '深圳', '广州', '成都', '杭州'] },
  { key: 'startDate', label: '出发日期', type: 'date', required: true },
  { key: 'endDate', label: '返回日期', type: 'date', required: true },
  { key: 'reason', label: '出差事由', type: 'textarea', required: true },
  { key: 'companions', label: '随行人员', type: 'person', required: false },
  { key: 'budget', label: '费用预算', type: 'number', required: true, unit: '元' }
];
const initiateLabelKeyMap = { '出差目的地': 'dest', '出发日期': 'startDate', '返回日期': 'endDate', '出差事由': 'reason', '随行人员': 'companions', '费用预算': 'budget' };

// 打开发起表单；prefillId 传入时预填该记录的 formData (A-08 重新发起)
function openInitiateForm(prefillId) {
  initiateFormValues = { dest: '', startDate: '', endDate: '', reason: '', companions: [], budget: '' };
  if (prefillId != null) {
    const src = approvalData.initiated.find(x => x.id === prefillId);
    if (src && src.formData) {
      src.formData.forEach(f => {
        const key = initiateLabelKeyMap[f.label];
        if (!key) return;
        if (key === 'companions') {
          initiateFormValues.companions = f.value ? f.value.split('、').filter(Boolean) : [];
        } else if (key === 'budget') {
          initiateFormValues.budget = String(f.value).replace(/[^0-9.]/g, '');
        } else {
          initiateFormValues[key] = f.value;
        }
      });
      showToast('info', '重新发起', '已预填上次申请内容，修改后重新提交即可');
    }
  }
  currentView = 'initiate-form';
  renderView();
}

function renderInitiateField(f) {
  const v = initiateFormValues[f.key];
  let html = `<div class="form-group" id="fg-${f.key}">`;
  html += `<label class="form-label">${f.label}${f.required ? '<span class="required">*</span>' : ''}</label>`;
  if (f.type === 'select') {
    html += `<select class="form-input" id="fi-${f.key}" onchange="setInitiateValue('${f.key}',this.value)">`;
    html += `<option value="">请选择${f.label}</option>`;
    f.options.forEach(o => { html += `<option value="${o}" ${v === o ? 'selected' : ''}>${o}</option>`; });
    html += `</select>`;
  } else if (f.type === 'date') {
    html += `<input class="form-input" id="fi-${f.key}" type="date" value="${escHtml(v || '')}" onchange="setInitiateValue('${f.key}',this.value)" />`;
  } else if (f.type === 'textarea') {
    html += `<textarea class="form-textarea" id="fi-${f.key}" placeholder="请填写${f.label}" oninput="setInitiateValue('${f.key}',this.value)">${escHtml(v || '')}</textarea>`;
  } else if (f.type === 'number') {
    html += `<div style="display:flex;align-items:center;gap:var(--space-2)"><input class="form-input" id="fi-${f.key}" type="number" min="0" placeholder="请输入${f.label}" value="${escHtml(v || '')}" oninput="setInitiateValue('${f.key}',this.value)" style="flex:1" /><span style="font-size:var(--font-size-sm);color:var(--md-on-surface-variant)">${f.unit || ''}</span></div>`;
  } else if (f.type === 'person') {
    html += renderCompanionPicker(v || []);
  }
  html += `<div class="form-error hidden" id="err-${f.key}">此项为必填</div>`;
  html += `</div>`;
  return html;
}

function setInitiateValue(key, value) {
  initiateFormValues[key] = value;
  // 输入后即时清除必填报错
  const err = document.getElementById('err-' + key);
  if (err && String(value).trim()) err.classList.add('hidden');
  const input = document.getElementById('fi-' + key);
  if (input && String(value).trim()) input.classList.remove('input-error');
}

function renderInitiateForm() {
  let html = `<div class="detail-page">`;
  html += `<div class="detail-back" onclick="backToList()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>返回列表</div>`;
  html += `<div class="detail-header"><div class="detail-title">出差申请表</div>`;
  html += `<div class="detail-subtitle">填写完毕后点击「提交申请」发起审批 &nbsp;·&nbsp; 带 <span style="color:var(--md-error)">*</span> 为必填项</div></div>`;
  html += `<div class="info-card"><div class="info-card-body" style="padding:var(--space-6)">`;
  initiateFields.forEach(f => { html += renderInitiateField(f); });
  html += `</div></div>`;
  html += `<div class="action-area"><div class="action-buttons">`;
  html += `<button class="btn btn-primary" id="submitInitiateBtn" onclick="submitInitiateForm()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>提交申请</button>`;
  html += `<button class="btn btn-outlined" onclick="backToList()">取消</button>`;
  html += `</div></div>`;
  html += `</div>`;
  return html;
}

function submitInitiateForm() {
  // 必填校验 (A-02)
  let firstErrorKey = null;
  initiateFields.forEach(f => {
    if (!f.required) return;
    const v = initiateFormValues[f.key];
    const empty = Array.isArray(v) ? v.length === 0 : !String(v || '').trim();
    const err = document.getElementById('err-' + f.key);
    const input = document.getElementById('fi-' + f.key);
    const group = document.getElementById('fg-' + f.key);
    if (empty) {
      if (!firstErrorKey) firstErrorKey = f.key;
      if (err) err.classList.remove('hidden');
      if (input) input.classList.add('input-error');
      if (group) {
        group.classList.remove('field-shake');
        void group.offsetWidth; // 重新触发动画
        group.classList.add('field-shake');
      }
    } else {
      if (err) err.classList.add('hidden');
      if (input) input.classList.remove('input-error');
    }
  });
  if (firstErrorKey) {
    const group = document.getElementById('fg-' + firstErrorKey);
    if (group) group.scrollIntoView({ behavior: 'smooth', block: 'center' });
    return;
  }
  // 提交 loading (A-03)
  const btn = document.getElementById('submitInitiateBtn');
  if (btn) {
    btn.disabled = true;
    btn.innerHTML = '<span class="btn-spinner"></span>提交中...';
  }
  setTimeout(finishInitiateSubmit, 800);
}

function finishInitiateSubmit() {
  const v = initiateFormValues;
  const record = {
    id: nextInstanceId++,
    formName: '出差申请',
    applicant: '我（Sukey Wu）',
    submitTime: nowFull(),
    status: 'in-progress', statusText: '审批中', badgeClass: 'badge-warning',
    summary: { '出差目的地': v.dest, '出发日期': v.startDate },
    currentStep: '',
    canWithdraw: true,
    ccList: [],
    formData: [
      { label: '出差目的地', value: v.dest },
      { label: '出发日期', value: v.startDate },

// --- Modal ---
function showModal(title, bodyHtml, buttons) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').innerHTML = bodyHtml;
  document.getElementById('modalFooter').innerHTML = buttons.map(b => {
    const style = b.style ? ` style="${b.style}"` : '';
    return `<button class="${b.class}"${style} onclick="${b.onclick}">${b.text}</button>`;
  }).join('');
  document.getElementById('modalOverlay').classList.add('active');
  // 自动聚焦第一个输入控件
  requestAnimationFrame(() => {
    const el = document.querySelector('#modalBody input:not([type="hidden"]), #modalBody textarea');
    if (el) el.focus();
  });
}

function closeModal(event) {
  if (event && event.target !== event.currentTarget) return;
  document.getElementById('modalOverlay').classList.remove('active');
}

// ESC 关闭弹窗 / 插入菜单 / 配置抽屉（按层级依次关闭）
document.addEventListener('keydown', function (e) {
  if (e.key !== 'Escape') return;
  if (document.getElementById('modalOverlay').classList.contains('active')) { closeModal(); return; }
  if (document.getElementById('addNodeMenu')) { closeAddNodeMenu(); return; }
  if (document.getElementById('configDrawer').classList.contains('open')) { closeConfigDrawer(); }
});

// --- Toast ---
function showToast(type, title, msg) {
  const container = document.getElementById('toastContainer');
  const icons = {
    success: '<svg viewBox="0 0 24 24" fill="none" stroke="#188038" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>',
    error: '<svg viewBox="0 0 24 24" fill="none" stroke="#D93025" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></svg>',
    info: '<svg viewBox="0 0 24 24" fill="none" stroke="#1A73E8" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>'
  };
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.innerHTML = `${icons[type] || icons.info}<div><strong>${title}</strong>${msg ? '<div style="color:var(--md-on-surface-variant);margin-top:2px;">' + msg + '</div>' : ''}</div>`;
  container.appendChild(toast);
  setTimeout(() => { toast.style.opacity = '0'; toast.style.transform = 'translateX(20px)'; toast.style.transition = '0.3s'; setTimeout(() => toast.remove(), 300); }, 3000);
}

// ============================================
// 通知面板 (A-06/R-09, PRD 第九章)
// ============================================
function toggleNotifPanel(event) {
  if (event) event.stopPropagation();
  const panel = document.getElementById('notifPanel');
  const willOpen = !panel.classList.contains('open');
  panel.classList.toggle('open');
  if (willOpen) renderNotifPanel();
}

function renderNotifPanel() {
  const panel = document.getElementById('notifPanel');
  let html = '<div class="notif-panel-header"><span>通知</span><button class="btn btn-text btn-sm" onclick="markAllNotifRead(event)">全部已读</button></div>';
  if (notifications.length === 0) {
    html += '<div class="notif-empty">暂无通知</div>';
  } else {
    notifications.forEach(n => {
      html += '<div class="notif-item ' + (n.unread ? 'unread' : '') + '" onclick="openNotifTarget(' + n.id + ')">';
      html += '<div class="notif-item-title">' + escHtml(n.title) + '</div>';
      html += '<div class="notif-item-body">' + escHtml(n.body) + '</div>';
      html += '<div class="notif-item-time">' + n.time + '</div>';
      html += '</div>';
    });
  }
  panel.innerHTML = html;
  updateNotifBadge();
}

function updateNotifBadge() {
  const badge = document.getElementById('notifBadge');
  const unread = notifications.filter(n => n.unread).length;
  if (unread > 0) { badge.textContent = unread; badge.classList.remove('hidden'); }
  else { badge.classList.add('hidden'); }
}

function markAllNotifRead(event) {
  if (event) event.stopPropagation();
  notifications.forEach(n => { n.unread = false; });
  renderNotifPanel();
}

function pushNotification(title, body, target) {
  notifications.unshift({ id: notifNextId++, title: title, body: body, time: nowShort(), unread: true, target: target || null });
  updateNotifBadge();
  const panel = document.getElementById('notifPanel');
  if (panel.classList.contains('open')) renderNotifPanel();
}

// 点击通知跳转到对应详情页
function openNotifTarget(id) {
  const n = notifications.find(x => x.id === id);
  if (!n) return;
  n.unread = false;
  submitBannerVisible = false;
  document.getElementById('notifPanel').classList.remove('open');
  updateNotifBadge();
  if (!n.target) { renderView(); return; }
  const t = n.target;
  if (t.type === 'pending') {
    const rec = approvalData.pending.find(x => x.id === t.id);
    if (rec) { currentDetailData = rec; currentView = 'approver-detail'; activeTab = 'pending'; renderView(); return; }
  } else if (t.type === 'initiated') {
    const rec = approvalData.initiated.find(x => x.id === t.id);
    if (rec) { currentDetailData = rec; currentView = 'initiator-detail'; activeTab = 'initiated'; renderView(); return; }
  } else if (t.type === 'processed') {
    const rec = approvalData.processed.find(x => x.id === t.id);
    if (rec) { currentDetailData = rec; currentView = 'processed-detail'; activeTab = 'processed'; renderView(); return; }
  } else if (t.type === 'cc') {
    const rec = approvalData.cc.find(x => x.id === t.id);
    if (rec) { currentDetailData = rec; currentView = 'cc-detail'; activeTab = 'cc'; renderView(); return; }
  }
  showToast('info', '通知', '对应的审批记录不存在或已被处理');
}

// 点击面板外部关闭通知面板
document.addEventListener('click', function (e) {
  const wrap = document.getElementById('notifWrap');
  const panel = document.getElementById('notifPanel');
  if (panel.classList.contains('open') && wrap && !wrap.contains(e.target)) {
    panel.classList.remove('open');
  }
});

// LionKing 人员选择器 (简易模拟)
// ============================================
let pickerState = { multi: false, selected: [], onConfirm: null, search: '' };

function showPersonPicker(opts) {
  pickerState = {
    multi: !!opts.multi,
    selected: (opts.selected || []).slice(),
    onConfirm: opts.onConfirm || null,
    search: ''
  };
  showModal(opts.title || '选择人员', renderPickerBody(), [
    { text: '取消', class: 'btn btn-outlined', onclick: 'closeModal()' },
    { text: '确认', class: 'btn btn-primary', onclick: 'confirmPersonPicker()' }
  ]);
}

function renderPickerBody() {
  let html = '<div class="form-hint" style="margin-bottom:var(--space-2)">' + (pickerState.multi ? '可选择多人' : '单人模式，只能选择 1 人') + '</div>';
  html += '<div class="picker-search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><input type="text" placeholder="搜索姓名或部门..." value="' + escHtml(pickerState.search) + '" oninput="onPickerSearch(this.value)" /></div>';
  html += '<div class="picker-list" id="pickerList">' + renderPickerItems() + '</div>';
  if (pickerState.selected.length > 0) {
    html += '<div style="margin-top:var(--space-3);display:flex;flex-wrap:wrap;gap:var(--space-1)" id="pickerSelected">' + pickerState.selected.map(p => '<span class="person-tag">' + escHtml(p) + '</span>').join('') + '</div>';
  } else {
    html += '<div style="margin-top:var(--space-3)" id="pickerSelected"></div>';
  }
  return html;
}

function renderPickerItems() {
  const q = pickerState.search.toLowerCase();
  const list = personList.filter(p => !q || p.name.toLowerCase().includes(q) || p.dept.toLowerCase().includes(q));
  if (!list.length) return '<div class="notif-empty">没有找到匹配的人员</div>';
  return list.map(p => {
    const checked = pickerState.selected.includes(p.name);
    return '<div class="picker-item ' + (checked ? 'checked' : '') + '" onclick="togglePickerPerson(\'' + p.name + '\')">'
      + '<div class="picker-item-avatar">' + escHtml(p.name.charAt(0)) + '</div>'
      + '<span class="picker-item-name">' + escHtml(p.name) + '</span>'
      + '<span class="picker-item-dept">' + escHtml(p.dept) + '</span>'
      + '<svg class="picker-item-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6 9 17l-5-5"/></svg>'
      + '</div>';
  }).join('');
}

function onPickerSearch(v) {
  pickerState.search = v;
  const list = document.getElementById('pickerList');
  if (list) list.innerHTML = renderPickerItems();
}

function togglePickerPerson(name) {
  if (pickerState.multi) {
    const i = pickerState.selected.indexOf(name);
    if (i >= 0) pickerState.selected.splice(i, 1); else pickerState.selected.push(name);
  } else {
    pickerState.selected = pickerState.selected[0] === name ? [] : [name];
  }
  const list = document.getElementById('pickerList');
  if (list) list.innerHTML = renderPickerItems();
  const sel = document.getElementById('pickerSelected');
  if (sel) sel.innerHTML = pickerState.selected.map(p => '<span class="person-tag">' + escHtml(p) + '</span>').join('');
}

function confirmPersonPicker() {
  if (pickerState.selected.length === 0) {
    showToast('error', '请选择人员', pickerState.multi ? '至少选择 1 人' : '请选择 1 人');
    return;
  }
  const cb = pickerState.onConfirm;
  const result = pickerState.selected.slice();
  closeModal();
  if (cb) cb(result);
}

// 「更多」操作：复制 / 删除
function showFlowMoreMenu(flowId) {
  const f = flowStore.find(x => x.id === flowId);
  if (!f) return;
  let body = '<div style="display:flex;flex-direction:column;gap:var(--space-2)">';
  body += '<div class="radio-card" onclick="duplicateFlow(' + flowId + ')"><div class="radio-card-content"><div class="radio-card-title">复制流程</div><div class="radio-card-desc">创建一份「' + escHtml(f.name) + ' 副本」草稿</div></div></div>';
  body += '<div class="radio-card" onclick="confirmDeleteFlow(' + flowId + ')"><div class="radio-card-content"><div class="radio-card-title" style="color:var(--md-error)">删除流程</div><div class="radio-card-desc">删除后不可恢复</div></div></div>';
  body += '</div>';
  showModal('更多操作 — ' + f.name, body, [{ text: '取消', class: 'btn btn-outlined', onclick: 'closeModal()' }]);
}

function duplicateFlow(flowId) {
  const f = flowStore.find(x => x.id === flowId);
  if (!f) return;
  const copy = JSON.parse(JSON.stringify(f));
  copy.id = flowNextId++;
  copy.name = f.name + ' 副本';
  copy.status = 'draft';
  copy.updatedAt = nowFull();
  flowStore.push(copy);
  closeModal();
  showToast('success', '复制成功', '已创建草稿「' + copy.name + '」');
  renderView();
}

function confirmDeleteFlow(flowId) {
  const f = flowStore.find(x => x.id === flowId);
  if (!f) return;
  showModal('删除流程', '<p>确定要删除「' + escHtml(f.name) + '」吗？删除后不可恢复。</p>', [
    { text: '取消', class: 'btn btn-outlined', onclick: 'closeModal()' },
    { text: '确认删除', class: 'btn btn-danger-filled', onclick: 'doDeleteFlow(' + flowId + ')' }
  ]);
}

function doDeleteFlow(flowId) {
  const i = flowStore.findIndex(x => x.id === flowId);
  if (i >= 0) flowStore.splice(i, 1);
  closeModal();
  showToast('success', '已删除', '流程已删除');
  renderView();
}

  html += '<span style="font-size:12px;color:var(--md-on-surface-variant)">' + workflowNodes.filter(n => n.type === 'approval').length + ' 个审批节点 · ' + workflowNodes.filter(n => n.type === 'cc').length + ' 个抄送节点</span>';
  html += '<span style="font-size:12px;color:var(--md-outline)">最后编辑：' + flow.updatedAt + '</span>';
  html += '</div>';
  html += '</div>';
  return html;
}

// 单个节点卡片（垂直画布）
function renderFlowNodeCard(node) {
  const summary = getNodeSummary(node);
  const isWarning = summary.includes('⚠');
  const deletable = node.type === 'approval' || node.type === 'cc';
  let html = '<div class="node-card ' + (selectedNodeId === node.id ? 'selected' : '') + '" onclick="openNodeConfig(\'' + node.id + '\')">';
  if (deletable) {
    html += '<span class="node-card-del" title="删除节点" onclick="event.stopPropagation();deleteFlowNode(\'' + node.id + '\')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></span>';
  }
  html += '<div class="node-card-header"><div class="node-card-icon ' + node.type + '">' + (nodeIcons[node.type] || '') + '</div><span class="node-card-title">' + escHtml(node.name) + '</span>';
  if (node.code) html += '<span style="margin-left:auto;font-size:10px;color:var(--md-outline);font-family:var(--font-family-mono)">' + node.code + '</span>';
  html += '</div>';
  html += '<div class="node-card-body"><div class="node-card-summary' + (isWarning ? ' warning' : '') + '">' + summary + '</div></div>';
  html += '</div>';
  return html;
}

// 节点间连接线（竖线 + 中点「+」按钮）
function renderFlowConnector(afterIndex) {
  let html = '<div class="flow-connector">';
  html += '<div class="flow-connector-line"></div>';
  html += '<button class="flow-add-btn" title="在此处添加节点" onclick="event.stopPropagation();showAddNodeMenu(event,' + (afterIndex + 1) + ')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14"/><path d="M5 12h14"/></svg></button>';
