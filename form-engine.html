// --- 拖拽状态 ---
let dragState = null; // { kind:'palette', type } 或 { kind:'sort', index }

function onPaletteDragStart(e, type) {
  dragState = { kind: 'palette', type };
  e.dataTransfer.effectAllowed = 'copy';
  e.dataTransfer.setData('text/plain', type);
}

function onFieldDragStart(e, index) {
  dragState = { kind: 'sort', index };
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', String(index));
  e.target.classList.add('dragging');
}

function onDragEnd() {
  dragState = null;
  clearDropIndicators();
  document.querySelectorAll('.fd-canvas-field.dragging').forEach(el => el.classList.remove('dragging'));
}

function clearDropIndicators() {
  document.querySelectorAll('.drop-before,.drop-after').forEach(el => { el.classList.remove('drop-before'); el.classList.remove('drop-after'); });
  document.querySelectorAll('.fd-column.drag-over').forEach(el => el.classList.remove('drag-over'));
}

function onCanvasFieldDragOver(e, index) {
  if (!dragState) return;
  e.preventDefault();
  e.stopPropagation();
  clearDropIndicators();
  const el = e.currentTarget;
  const rect = el.getBoundingClientRect();
  const before = e.clientY < rect.top + rect.height / 2;
  el.classList.add(before ? 'drop-before' : 'drop-after');
}

function onCanvasFieldDrop(e, index) {
  if (!dragState) return;
  e.preventDefault();
  e.stopPropagation();
  const rect = e.currentTarget.getBoundingClientRect();
  const before = e.clientY < rect.top + rect.height / 2;
  let insertAt = before ? index : index + 1;
  if (dragState.kind === 'palette') {
    addField(dragState.type, insertAt);
  } else if (dragState.kind === 'sort') {
    const from = dragState.index;
    if (from !== index) {
      const [moved] = designerFields.splice(from, 1);
      if (from < insertAt) insertAt--;
      designerFields.splice(insertAt, 0, moved);
      selectedFieldIndex = insertAt;
      selectedColPos = null;
      renderCanvas();
      renderProps();
    }
  }
  onDragEnd();
}

function onCanvasDragOver(e) {
  if (!dragState) return;
  e.preventDefault();
}

function onCanvasDrop(e) {
  if (!dragState) return;
  e.preventDefault();
  if (dragState.kind === 'palette') {
    addField(dragState.type);
  } else if (dragState.kind === 'sort') {
    const from = dragState.index;
    const [moved] = designerFields.splice(from, 1);
    designerFields.push(moved);
    selectedFieldIndex = designerFields.length - 1;
    selectedColPos = null;
    renderCanvas();
    renderProps();
  }
  onDragEnd();
}

// 拖入分栏栏位
function onColumnDragOver(e) {
  if (!dragState || dragState.kind !== 'palette') return;
  if (dragState.type === 'columns' || dragState.type === 'detail') return;
  e.preventDefault();
  e.stopPropagation();
  clearDropIndicators();
  e.currentTarget.classList.add('drag-over');
}

function onColumnDrop(e, fieldIndex, colIndex) {
  if (!dragState || dragState.kind !== 'palette') return;
  if (dragState.type === 'columns' || dragState.type === 'detail') return;
  e.preventDefault();
  e.stopPropagation();
  addFieldToColumn(fieldIndex, colIndex, dragState.type);
  onDragEnd();
}

// --- Delete 键删除选中字段 ---
document.addEventListener('keydown', function (e) {
  if (e.key !== 'Delete') return;
  const tag = (document.activeElement && document.activeElement.tagName) || '';
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || (document.activeElement && document.activeElement.isContentEditable)) return;
  if (!document.getElementById('designerShell').classList.contains('active')) return;
  if (document.getElementById('previewOverlay').classList.contains('active')) return;
  if (document.getElementById('modalOverlay').classList.contains('active')) return;
  if (selectedFieldIndex < 0) return;
  if (selectedColPos) {
    deleteColumnField(selectedFieldIndex, selectedColPos[0], selectedColPos[1]);
  } else {
    deleteField(selectedFieldIndex);
  }
});

// --- 画布渲染 ---
function renderCanvas() {
  const inner = document.getElementById('fdCanvasInner');
  if (designerFields.length === 0) {
    inner.innerHTML = `
      <div class="fd-canvas-empty">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
        <div class="fd-canvas-empty-text">点击或拖拽左侧字段类型添加字段</div>
        <div class="fd-canvas-empty-hint">支持拖拽排序，选中后按 Delete 键删除</div>
      </div>`;
    return;
  }
  inner.innerHTML = designerFields.map((f, i) => renderCanvasField(f, i)).join('');
}

function renderCanvasField(field, index) {
  const selected = (index === selectedFieldIndex && !selectedColPos) ? 'selected' : '';
  const reqStar = field.props && field.props.required ? '<span class="required-star">*</span>' : '';
  let controlHtml = '';

  switch (field.type) {
    case 'shortText':
      controlHtml = `<div class="field-control"><input type="text" placeholder="${escHtml(field.props?.placeholder || '')}" readonly /></div>`;
      break;
    case 'longText':
      controlHtml = `<div class="field-control"><textarea placeholder="${escHtml(field.props?.placeholder || '')}" readonly></textarea></div>`;
      break;
    case 'number':
      const unitHtml = field.props?.unit ? `<span style="margin-left:8px;font-size:12px;color:var(--md-on-surface-variant);">${escHtml(field.props.unit)}</span>` : '';
      controlHtml = `<div class="field-control" style="display:flex;align-items:center;"><input type="text" placeholder="请输入数字" readonly style="flex:1;" />${unitHtml}</div>`;
      break;
    case 'radio':
      const layout = field.props?.layout === 'horizontal' ? 'horizontal' : '';
      const opts = (field.props?.options || ['选项1', '选项2']).map(o => `<div class="fd-radio-item"><div class="fd-radio-circle"></div>${escHtml(o)}</div>`).join('');
      controlHtml = `<div class="fd-radio-list ${layout}">${opts}</div>`;
      break;
    case 'checkbox':
      const cLayout = field.props?.layout === 'horizontal' ? 'horizontal' : '';
      const cOpts = (field.props?.options || ['选项1', '选项2']).map(o => `<div class="fd-checkbox-item"><div class="fd-checkbox-box"></div>${escHtml(o)}</div>`).join('');
      controlHtml = `<div class="fd-checkbox-list ${cLayout}">${cOpts}</div>`;
      break;
    case 'dropdown':
      controlHtml = `<div class="field-control"><select disabled><option>${escHtml(field.props?.placeholder || '请选择')}</option></select></div>`;
      break;
    case 'datetime':
      controlHtml = `<div class="field-control"><input type="text" placeholder="请选择日期" readonly /></div>`;
      break;
    case 'person':
      controlHtml = `<div class="fd-person-selector"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg><span>点击选择人员</span></div>`;
      break;
    case 'columns':
      controlHtml = renderDesignerColumns(field, index);
      break;
    case 'detail':
      const cols2 = field.props?.columns || [];
      const headerRow = '<tr>' + cols2.map(c => `<th>${escHtml(c.name)}</th>`).join('') + '<th style="width:50px;">操作</th></tr>';
      const dataRow = '<tr>' + cols2.map(() => '<td>...</td>').join('') + '<td style="text-align:center;color:var(--md-outline);">删除</td></tr>';
      controlHtml = `<div style="overflow-x:auto;"><table class="fd-detail-table">${headerRow}${dataRow}</table></div>
        <div style="text-align:center;margin-top:8px;font-size:12px;color:var(--md-primary);cursor:pointer;">+ 添加一行</div>`;
      break;
    case 'readonlyText':
      const styleClass = field.props?.style === 'title' ? 'style-title' : field.props?.style === 'desc' ? 'style-desc' : '';
      controlHtml = `<div class="fd-readonly-text ${styleClass}">${escHtml(field.props?.text || '只读文本内容')}</div>`;
      break;
  }

  const isBoxed = ['shortText', 'longText', 'number', 'dropdown', 'datetime', 'person'].includes(field.type);
  const labelHtml = `<div class="field-label">${escHtml(field.name)}${reqStar}</div>`;
  const bodyHtml = isBoxed ? `<div class="vf-wrap">${labelHtml}${controlHtml}</div>` : `${labelHtml}${controlHtml}`;

  return `
    <div class="fd-canvas-field ${selected}" draggable="true"
      ondragstart="onFieldDragStart(event, ${index})" ondragend="onDragEnd(event)"
      ondragover="onCanvasFieldDragOver(event, ${index})" ondragleave="clearDropIndicators()"
      ondrop="onCanvasFieldDrop(event, ${index})"
      onclick="selectField(${index}, event)" data-index="${index}">
      <div class="field-actions">
        <button onclick="copyField(${index}, event)" title="复制">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        </button>
        <button class="delete" onclick="deleteField(${index}, event)" title="删除">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        </button>
      </div>
      ${bodyHtml}
    </div>
  `;
}

// --- 设计器画布中的分栏渲染 ---
function renderDesignerColumns(field, fieldIndex) {
  const colCount = Number(field.props?.colCount) || 2;
  const colsData = field.props?.columns_data || [];
  const cols = Array.from({ length: colCount }, (_, ci) => {
    const colFields = colsData[ci] || [];
    const fieldsHtml = colFields.map((cf, fi) => renderDesignerColField(cf, fieldIndex, ci, fi)).join('');
    return `<div class="fd-column" ondragover="onColumnDragOver(event)" ondragleave="clearDropIndicators()" ondrop="onColumnDrop(event, ${fieldIndex}, ${ci})">
      ${fieldsHtml}
      <div class="fd-col-add" onclick="showColumnFieldPicker(${fieldIndex}, ${ci}, event)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px;"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
        添加字段
      </div>
    </div>`;
  }).join('');
  return `<div class="fd-columns">${cols}</div>`;
}

function renderDesignerColField(cf, fieldIndex, colIndex, fi) {
  const isSel = selectedFieldIndex === fieldIndex && selectedColPos && selectedColPos[0] === colIndex && selectedColPos[1] === fi;
  const star = cf.props?.required ? '<span class="required-star">*</span>' : '';
  const ft = FIELD_TYPES.find(t => t.type === cf.type);
  return `<div class="fd-col-field ${isSel ? 'selected' : ''}" onclick="selectColumnField(${fieldIndex}, ${colIndex}, ${fi}, event)">
    <div class="cf-del" onclick="deleteColumnField(${fieldIndex}, ${colIndex}, ${fi}, event)" title="删除">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
    </div>
    <div class="cf-label">${escHtml(cf.name)}${star}</div>
    <div class="cf-ctrl">${ft ? ft.name : cf.type}</div>
  </div>`;
}

// --- 属性面板渲染 ---
function renderProps() {
  const body = document.getElementById('fdPropsBody');
  const field = getSelectedField();
  if (!field) {
    body.innerHTML = `<div class="fd-props-empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg><div>点击画布中的字段<br/>配置属性</div></div>`;
    return;
  }
  body.innerHTML = renderPropsForField(field);
}

// 当前表单内其他字段名（含分栏内，排除自身；供「引用字段」下拉）
function getOtherFieldNames(exclude) {
  const names = [];
  const walk = (f) => {
    if (f === exclude || f.type === 'readonlyText' || f.type === 'columns') {
      if (f.type === 'columns') (f.props?.columns_data || []).forEach(col => col.forEach(walk));
      return;
    }
    names.push(f.name);
  };
  designerFields.forEach(walk);
  return names;
}

// 折叠分组展开状态（校验规则 / 高级设置默认收起；切换选中字段时重置）
let propGroupExpanded = { validation: false, advanced: false };

function resetPropGroups() {
  propGroupExpanded = { validation: false, advanced: false };
}

function togglePropGroup(key) {
  propGroupExpanded[key] = !propGroupExpanded[key];
  renderProps();
}

// 判断某个属性是否已配置（用于收起时的「已设 N 项」徽标）
function propIsSet(v) {
  if (v === undefined || v === null || v === '') return false;
  if (Array.isArray(v)) return v.length > 0;
  return true;
}

function propGroup(key, title, bodyHtml, setCount) {
  if (!bodyHtml) return '';
  const open = propGroupExpanded[key];
  const badge = !open && setCount > 0 ? `<span class="fd-prop-group-badge">已设 ${setCount} 项</span>` : '';
  return `<div class="fd-prop-group ${open ? 'open' : ''}">
    <div class="fd-prop-group-header" onclick="togglePropGroup('${key}')">
      <span class="fd-prop-group-title">${title}</span>${badge}
      <svg class="fd-prop-group-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
    </div>
    ${open ? `<div class="fd-prop-group-body">${bodyHtml}</div>` : ''}
  </div>`;
}

function renderPropsForField(field) {
  const p = field.props || {};
  let basic = '';
  let validation = '';
  let advanced = '';
  let vCount = 0;
  let aCount = 0;

  // 字段名称
  if (field.type !== 'columns') {
    basic += `<div class="fd-prop-row"><label class="fd-prop-label">字段名称</label><input class="fd-prop-input" maxlength="30" value="${escHtml(field.name)}" onchange="updateFieldName(this.value)" /></div>`;
  }

  switch (field.type) {
    case 'shortText':
      basic += propCheck('required', '是否必填', p.required);
      validation += propInput('maxLength', '最大长度', p.maxLength || '', 'number');
      if (propIsSet(p.maxLength)) vCount++;
      advanced += propInput('placeholder', '占位提示', p.placeholder || '');
      advanced += propInput('defaultValue', '默认值', p.defaultValue || '');
      if (propIsSet(p.placeholder)) aCount++;
      if (propIsSet(p.defaultValue)) aCount++;
      break;
    case 'longText':
      basic += propCheck('required', '是否必填', p.required);
      validation += propInput('maxLength', '最大长度', p.maxLength || '', 'number');
      if (propIsSet(p.maxLength)) vCount++;
      advanced += propInput('placeholder', '占位提示', p.placeholder || '');
      advanced += propInput('rows', '行数', p.rows || 4, 'number');
      advanced += propInput('defaultValue', '默认值', p.defaultValue || '');
      if (propIsSet(p.placeholder)) aCount++;
      if (propIsSet(p.rows) && Number(p.rows) !== 4) aCount++;
      if (propIsSet(p.defaultValue)) aCount++;
      break;
    case 'number':
      basic += propCheck('required', '是否必填', p.required);
      basic += propInput('decimal', '小数位数', p.decimal || 0, 'number');
      basic += propInput('unit', '单位', p.unit || '');
      validation += propInput('min', '最小值', p.min ?? '', 'number');
      validation += propInput('max', '最大值', p.max ?? '', 'number');
      if (propIsSet(p.min)) vCount++;
      if (propIsSet(p.max)) vCount++;
      advanced += propInput('defaultValue', '默认值', p.defaultValue || '', 'number');
      if (propIsSet(p.defaultValue)) aCount++;
      break;
    case 'radio':
      basic += propCheck('required', '是否必填', p.required);
      basic += '</div><div class="fd-props-section"><div class="fd-props-section-title">选项列表</div>';
      basic += renderOptionList(p.options || [], 'radio');
      advanced += renderDefaultCheckedSelect(field, false);
      advanced += propSelect('layout', '排列方式', p.layout || 'vertical', [['vertical', '竖排'], ['horizontal', '横排']]);
      if (propIsSet(p.defaultChecked)) aCount++;
      if (p.layout === 'horizontal') aCount++;
      break;
    case 'checkbox':
      basic += propCheck('required', '是否必填', p.required);
      basic += '</div><div class="fd-props-section"><div class="fd-props-section-title">选项列表</div>';
      basic += renderOptionList(p.options || [], 'checkbox');
      advanced += renderDefaultCheckedSelect(field, true);
      advanced += propSelect('layout', '排列方式', p.layout || 'vertical', [['vertical', '竖排'], ['horizontal', '横排']]);
      if (propIsSet(p.defaultChecked)) aCount++;
      if (p.layout === 'horizontal') aCount++;
      break;
    case 'dropdown':
      basic += propSelect('mode', '选择模式', p.mode || 'single', [['single', '单选'], ['multi', '多选']]);
      basic += propCheck('required', '是否必填', p.required);
      basic += propSelect('source', '数据来源', p.source || 'manual', [['manual', '手动填写'], ['api', '从接口获取']]);
      if (p.source === 'api') {
        basic += '</div><div class="fd-props-section"><div class="fd-props-section-title">接口配置</div>';
        basic += propInput('apiUrl', '接口地址', p.apiUrl || '', 'url');
        basic += propSelect('apiMethod', '请求方式', p.apiMethod || 'GET', [['GET', 'GET'], ['POST', 'POST']]);
        basic += propInput('displayField', '显示字段', p.displayField || '');
        basic += propInput('valueField', '值字段', p.valueField || '');
        basic += '</div><div class="fd-props-section"><div class="fd-props-section-title">请求参数</div>';
        basic += renderApiParams(field);
        basic += `<div class="fd-prop-row"><button class="btn btn-outlined btn-sm" onclick="testApiConfig()">测试</button></div>`;
      } else {
        basic += '</div><div class="fd-props-section"><div class="fd-props-section-title">选项列表</div>';
        basic += renderOptionList(p.options || [], 'radio');
        advanced += renderDefaultCheckedSelect(field, p.mode === 'multi');
        if (propIsSet(p.defaultChecked)) aCount++;
      }
      advanced += propInput('placeholder', '占位提示', p.placeholder || '请选择');
      if (propIsSet(p.placeholder) && p.placeholder !== '请选择') aCount++;
      break;
    case 'datetime':
      basic += propSelect('format', '格式', p.format || 'datetime', [['date', '仅日期'], ['datetime', '日期+时间']]);
      basic += propCheck('required', '是否必填', p.required);
      validation += propInput('minDate', '最早可选日期', p.minDate || '', 'date');
      validation += propInput('maxDate', '最晚可选日期', p.maxDate || '', 'date');
      if (propIsSet(p.minDate)) vCount++;
      if (propIsSet(p.maxDate)) vCount++;
      advanced += propInput('defaultValue', '默认值', p.defaultValue || '');
      advanced += `<div class="fd-prop-row"><div class="form-hint">默认值可填固定日期，或填「当前时间」表示打开表单时的时间</div></div>`;
      if (propIsSet(p.defaultValue)) aCount++;
      break;
    case 'person':
      basic += propCheck('required', '是否必填', p.required);
      basic += propSelect('personMode', '选择模式', p.personMode || 'single', [['single', '单人'], ['multi', '多人']]);
      basic += propSelect('personScope', '选择范围', p.personScope || 'all', [['all', '全部'], ['employee', '仅员工'], ['dept', '仅部门'], ['role', '仅角色']]);
      advanced += propInput('defaultValue', '默认值', p.defaultValue || '');
      if (propIsSet(p.defaultValue)) aCount++;
      break;
    case 'columns':
      basic += propSelect('colCount', '栏数', p.colCount || 2, [[2, '2 栏'], [3, '3 栏']]);
      basic += `<div class="fd-prop-row"><div class="fd-prop-label" style="font-size:11px;color:var(--md-outline);">各栏宽度自动等分</div></div>`;
      break;
    case 'detail':
      basic += propCheck('required', '是否必填', p.required);
      basic += '</div><div class="fd-props-section"><div class="fd-props-section-title">列配置</div>';
      basic += renderColumnConfig(p.columns || []);
      break;
    case 'readonlyText':
      basic += `<div class="fd-prop-row"><label class="fd-prop-label">文本内容</label><textarea class="fd-prop-input" style="height:80px;padding:8px 12px;resize:vertical;" onchange="updateFieldProp('text',this.value)">${escHtml(p.text || '')}</textarea></div>`;
      basic += propSelect('style', '样式', p.style || 'body', [['title', '标题（大号加粗）'], ['body', '正文（常规）'], ['desc', '说明（小号灰色）']]);
      break;
  }

  let html = '<div class="fd-props-section"><div class="fd-props-section-title">基础属性</div>' + basic + '</div>';
  html += propGroup('validation', '校验规则', validation, vCount);
  html += propGroup('advanced', '高级设置', advanced, aCount);
  return html;
}

// 默认选中配置（单选=单选下拉；多选=逗号分隔的多选值，简单用下拉多次选择或输入）
function renderDefaultCheckedSelect(field, isMulti) {
  const options = field.props?.options || [];
  const current = field.props?.defaultChecked;
  if (isMulti) {
    const curArr = Array.isArray(current) ? current : (current ? [current] : []);
    const checks = options.map(o => `<label class="fd-prop-check" style="margin-bottom:4px;"><input type="checkbox" value="${escHtml(o)}" ${curArr.includes(o) ? 'checked' : ''} onchange="updateDefaultCheckedMulti()" />${escHtml(o)}</label>`).join('');
    return `<div class="fd-prop-row" id="defaultCheckedGroup"><label class="fd-prop-label">默认选中</label>${checks || '<div class="form-hint">请先添加选项</div>'}</div>`;
  }
  const opts = ['<option value="">无</option>'].concat(options.map(o => `<option value="${escHtml(o)}" ${current === o ? 'selected' : ''}>${escHtml(o)}</option>`)).join('');
  return `<div class="fd-prop-row"><label class="fd-prop-label">默认选中</label><select class="fd-prop-select" onchange="updateFieldProp('defaultChecked',this.value)">${opts}</select></div>`;
}

function updateDefaultCheckedMulti() {
  const field = getSelectedField();
  if (!field) return;
  const group = document.getElementById('defaultCheckedGroup');
  const vals = Array.from(group.querySelectorAll('input:checked')).map(i => i.value);
  field.props.defaultChecked = vals;
  renderCanvas();
}

// --- 接口请求参数配置 ---
function renderApiParams(field) {
  const params = field.props?.params || [];
  const otherNames = getOtherFieldNames(field);
  let html = '';
  params.forEach((p, i) => {
    let valueCtrl;
    if (p.valueType === 'ref') {
      const opts = ['<option value="">请选择字段</option>'].concat(otherNames.map(n => `<option value="${escHtml(n)}" ${p.value === n ? 'selected' : ''}>${escHtml(n)}</option>`)).join('');
      valueCtrl = `<select onchange="updateApiParam(${i},'value',this.value)">${opts}</select>`;
    } else {
      valueCtrl = `<input placeholder="参数值" value="${escHtml(p.value || '')}" onchange="updateApiParam(${i},'value',this.value)" />`;
    }
    html += `<div class="fd-param-item">
      <div class="param-line">
        <input placeholder="参数名" value="${escHtml(p.name || '')}" onchange="updateApiParam(${i},'name',this.value)" />
        <select onchange="updateApiParam(${i},'valueType',this.value)">
          <option value="fixed" ${p.valueType !== 'ref' ? 'selected' : ''}>固定值</option>
          <option value="ref" ${p.valueType === 'ref' ? 'selected' : ''}>引用字段</option>
        </select>
        <div class="col-del" onclick="deleteApiParam(${i})"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></div>
      </div>
      <div class="param-line">${valueCtrl}</div>
    </div>`;
  });
  html += `<div class="fd-add-option" onclick="addApiParam()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14"/><path d="M5 12h14"/></svg>添加参数</div>`;
  return `<div class="fd-prop-row">${html}</div>`;
}

function addApiParam() {
  const field = getSelectedField();
  if (!field) return;
  if (!field.props.params) field.props.params = [];
  field.props.params.push({ name: '', valueType: 'fixed', value: '' });
  renderProps();
}

function updateApiParam(index, key, value) {
  const field = getSelectedField();
  if (!field || !field.props.params) return;
  field.props.params[index][key] = value;
  if (key === 'valueType') { field.props.params[index].value = ''; renderProps(); }
}

function deleteApiParam(index) {
  const field = getSelectedField();
  if (!field || !field.props.params) return;
  field.props.params.splice(index, 1);
  renderProps();
}

// --- 「测试」按钮：mock 返回选项列表预览 ---
function testApiConfig() {
  const field = getSelectedField();
  if (!field) return;
  if (!field.props.apiUrl) { showToast('error', '测试失败', '请先填写接口地址'); return; }
  const mockOptions = ['上海', '北京', '深圳', '广州', '成都'];
  const list = mockOptions.map(o => `<li style="padding:6px 0;border-bottom:1px solid var(--color-border);">${escHtml(o)}</li>`).join('');
  showModal('接口测试结果', `
    <div class="form-hint" style="margin-bottom:12px;">请求 <code>${escHtml(field.props.apiUrl)}</code> 成功，返回 ${mockOptions.length} 条选项（mock 演示数据）：</div>
    <ul style="list-style:none;">${list}</ul>
  `, [
    { text: '关闭', class: 'btn btn-primary', onclick: 'closeModal()' }
  ]);
}

function propInput(key, label, value, type = 'text') {
  return `<div class="fd-prop-row"><label class="fd-prop-label">${label}</label><input class="fd-prop-input" type="${type}" value="${escHtml(value)}" onchange="updateFieldProp('${key}',this.value)" /></div>`;
}
function propCheck(key, label, checked) {
  return `<div class="fd-prop-row"><label class="fd-prop-check"><input type="checkbox" ${checked ? 'checked' : ''} onchange="updateFieldProp('${key}',this.checked)" />${label}</label></div>`;
}
function propSelect(key, label, value, options) {
  const opts = options.map(o => `<option value="${o[0]}" ${String(o[0]) === String(value) ? 'selected' : ''}>${o[1]}</option>`).join('');
  return `<div class="fd-prop-row"><label class="fd-prop-label">${label}</label><select class="fd-prop-select" onchange="updateFieldProp('${key}',this.value)">${opts}</select></div>`;
}

function renderOptionList(options, iconType) {
  const icon = iconType === 'radio' ? '<div class="opt-radio"></div>' : '<div class="opt-check"></div>';
  let html = '<div class="fd-option-list">';
  options.forEach((opt, i) => {
    html += `<div class="fd-option-item">${icon}<input value="${escHtml(opt)}" onchange="updateOption(${i},this.value)" /><div class="opt-del" onclick="deleteOption(${i})"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></div></div>`;
  });
  html += `<div class="fd-add-option" onclick="addOption()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14"/><path d="M5 12h14"/></svg>添加选项</div>`;
  html += '</div>';
  return `<div class="fd-prop-row">${html}</div>`;
}

// --- 明细列配置（可编辑） ---
function renderColumnConfig(columns) {
  let html = '<div class="fd-col-config">';
  columns.forEach((col, i) => {
    html += renderColumnConfigItem(col, i);
  });
  html += '</div><div class="fd-add-option" onclick="addDetailColumn()" style="margin-top:8px;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14"/><path d="M5 12h14"/></svg>添加列</div>';
  return html;
}

function renderColumnConfigItem(col, i) {
  const typeOpts = [['text', '文本'], ['number', '数字'], ['date', '日期'], ['dropdown', '下拉选择']]
    .map(t => `<option value="${t[0]}" ${col.type === t[0] ? 'selected' : ''}>${t[1]}</option>`).join('');
  let html = `<div>
    <div class="fd-col-config-item">
      <input value="${escHtml(col.name)}" placeholder="列名" maxlength="30" style="max-width:80px;" onchange="updateDetailColumn(${i},'name',this.value)" />
      <select onchange="updateDetailColumn(${i},'type',this.value)">${typeOpts}</select>
      <label class="col-req"><input type="checkbox" ${col.required ? 'checked' : ''} onchange="updateDetailColumn(${i},'required',this.checked)" />必填</label>
      <div class="col-del" onclick="deleteDetailColumn(${i})"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></div>
    </div>`;
  if (col.type === 'dropdown') {
    html += `<div style="padding:8px 8px 0 8px;">${renderDetailColOptions(col, i)}</div>`;
  }
  html += '</div>';
  return html;
}

function renderDetailColOptions(col, colIndex) {
  const options = col.options || [];
  let html = '<div class="fd-option-list">';
  options.forEach((opt, oi) => {
    html += `<div class="fd-option-item"><div class="opt-radio"></div><input value="${escHtml(opt)}" onchange="updateDetailColOption(${colIndex},${oi},this.value)" /><div class="opt-del" onclick="deleteDetailColOption(${colIndex},${oi})"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></div></div>`;
  });
  html += `<div class="fd-add-option" onclick="addDetailColOption(${colIndex})"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14"/><path d="M5 12h14"/></svg>添加选项</div>`;
  html += '</div>';
  return html;
}

function addDetailColumn() {
  const field = getSelectedField();
  if (!field || field.type !== 'detail') return;
  if (!field.props.columns) field.props.columns = [];
  field.props.columns.push({ name: '新列' + (field.props.columns.length + 1), type: 'text', required: false });
  renderCanvas();
  renderProps();
}

function updateDetailColumn(index, key, value) {

function selectField(index, event) {

}

function selectColumnField(fieldIndex, colIndex, fi, event) {
  if (event) event.stopPropagation();
  if (selectedFieldIndex !== fieldIndex || !selectedColPos || selectedColPos[0] !== colIndex || selectedColPos[1] !== fi) resetPropGroups();
  selectedFieldIndex = fieldIndex;

  renderProps();
}

function handleCanvasClick(event) {
  if (event.target.id === 'fdCanvas' || event.target.id === 'fdCanvasInner') {
    selectedFieldIndex = -1;
    selectedColPos = null;
    renderCanvas();
    renderProps();
  }
}

function buildDefaultField(type) {
  const ft = FIELD_TYPES.find(t => t.type === type);
  const field = { type, name: ft.name, props: {} };
  switch (type) {
    case 'shortText': field.props = { placeholder: '', required: false }; break;
    case 'longText': field.props = { placeholder: '', required: false, rows: 4 }; break;
    case 'number': field.props = { required: false, decimal: 0 }; break;
    case 'radio': field.props = { required: false, layout: 'vertical', options: ['选项1', '选项2'] }; break;
    case 'checkbox': field.props = { required: false, layout: 'vertical', options: ['选项1', '选项2'] }; break;
    case 'dropdown': field.props = { required: false, mode: 'single', source: 'manual', placeholder: '请选择', options: ['选项1', '选项2'] }; break;
    case 'datetime': field.props = { required: false, format: 'datetime' }; break;
    case 'person': field.props = { required: false, personMode: 'single', personScope: 'all' }; break;
    case 'columns': field.props = { colCount: 2, columns_data: [[], []] }; break;
    case 'detail': field.props = { required: true, columns: [{ name: '列1', type: 'text', required: false }] }; break;
    case 'readonlyText': field.props = { text: '请输入说明文本', style: 'body' }; break;
  }
  return field;
}

function addField(type, insertAt) {
  const field = buildDefaultField(type);
  if (insertAt === undefined || insertAt === null || insertAt > designerFields.length) insertAt = designerFields.length;
  designerFields.splice(insertAt, 0, field);
  selectedFieldIndex = insertAt;
  selectedColPos = null;
  renderCanvas();
  renderProps();
  showToast('success', '添加成功', `已添加「${FIELD_TYPES.find(t => t.type === type).name}」字段`);
}

// --- 分栏栏位内字段操作 ---
function addFieldToColumn(fieldIndex, colIndex, type) {
  const colField = designerFields[fieldIndex];
  if (!colField || colField.type !== 'columns') return;
  if (!colField.props.columns_data) colField.props.columns_data = [[], []];
  while (colField.props.columns_data.length <= colIndex) colField.props.columns_data.push([]);
  const newField = buildDefaultField(type);
  colField.props.columns_data[colIndex].push(newField);
  selectedFieldIndex = fieldIndex;
  selectedColPos = [colIndex, colField.props.columns_data[colIndex].length - 1];
  renderCanvas();
  renderProps();
  showToast('success', '添加成功', `已添加「${FIELD_TYPES.find(t => t.type === type).name}」字段到栏位 ${colIndex + 1}`);
}

function deleteColumnField(fieldIndex, colIndex, fi, event) {

  const colField = designerFields[fieldIndex];
  if (!colField || !colField.props.columns_data) return;
  colField.props.columns_data[colIndex].splice(fi, 1);

}

function updateFieldProp(key, value) {
  const field = getSelectedField();
  if (!field) return;
  // 分栏切换栏数：3→2 时把第 3 栏字段并入第 2 栏
  if (field.type === 'columns' && key === 'colCount') {
    const newCount = Number(value);
    const data = field.props.columns_data || [];
    while (data.length < newCount) data.push([]);
    if (newCount < data.length) {
      const removed = data.splice(newCount);
      removed.forEach(colArr => { data[newCount - 1] = data[newCount - 1].concat(colArr); });
    }
    field.props.colCount = newCount;
    field.props.columns_data = data;
    selectedColPos = null;
    renderCanvas();
    renderProps();
    return;
  }
  field.props[key] = value;
  // 数据来源/选择模式切换需要重绘属性面板
  if (key === 'source' || key === 'mode') renderProps();
  renderCanvas();
}

// --- 保存校验（PRD 7.1 九条，递归含分栏内字段） ---
function collectAllFields() {
  // 返回 [{field, ordinal}]，ordinal 为顶层序号（分栏内字段沿用所在分栏的序号）
  const result = [];
  designerFields.forEach((f, i) => {
    if (f.type === 'columns') {
      (f.props?.columns_data || []).forEach(col => col.forEach(cf => result.push({ field: cf, ordinal: i + 1 })));
    } else {
      result.push({ field: f, ordinal: i + 1 });
    }
  });
  return result;
}

function validateFormForSave() {
  const errors = [];
  const name = document.getElementById('fdFormName').value.trim();
  if (!name) errors.push('请输入表单名称');
  const all = collectAllFields();
  if (designerFields.length === 0) {
    errors.push('请至少添加一个字段');
    return errors;
  }
  // 字段名称为空 / 超长
  all.forEach(({ field, ordinal }) => {
    const fname = (field.name || '').trim();
    if (field.type === 'readonlyText') return;
    if (!fname) {
      errors.push(`第 ${ordinal} 个字段的名称不能为空`);
    } else if (fname.length > 30) {
      errors.push(`字段「${fname}」名称不能超过 30 个字符`);
    }
  });
  // 字段名称重复
  const seen = new Set();
  const dupReported = new Set();
  all.forEach(({ field }) => {
    if (field.type === 'readonlyText') return;
    const fname = (field.name || '').trim();
    if (!fname) return;
    if (seen.has(fname) && !dupReported.has(fname)) {
      errors.push(`字段名称「${fname}」重复，请修改`);
      dupReported.add(fname);
    }
    seen.add(fname);
  });
  // 各类型专项校验
  all.forEach(({ field }) => {
    const fname = (field.name || '').trim() || '(未命名)';
    if (field.type === 'radio' || field.type === 'checkbox') {
      if (!(field.props?.options || []).length) errors.push(`字段「${fname}」至少需要添加一个选项`);
    }
    if (field.type === 'dropdown') {
      if (field.props?.source === 'api') {
        if (!(field.props?.apiUrl || '').trim()) errors.push(`字段「${fname}」的数据来源接口地址不能为空`);
        if (!(field.props?.displayField || '').trim() || !(field.props?.valueField || '').trim()) errors.push(`字段「${fname}」的显示字段和值字段不能为空`);
      } else {
        if (!(field.props?.options || []).length) errors.push(`字段「${fname}」至少需要添加一个选项`);
      }
    }
    if (field.type === 'detail') {
      if (!(field.props?.columns || []).length) errors.push(`字段「${fname}」至少需要添加一个列`);
    }
  });
  return errors;
}

function saveForm() {
  const errors = validateFormForSave();
  if (errors.length > 0) {
    if (errors.length === 1) {
      showToast('error', '无法保存', escHtml(errors[0]));
    } else {
      const list = errors.map(e => `<li style="margin-bottom:6px;">${escHtml(e)}</li>`).join('');
      showModal('无法保存', `<ul style="padding-left:20px;color:var(--md-error);">${list}</ul>`, [
        { text: '我知道了', class: 'btn btn-primary', onclick: 'closeModal()' }

    return;
  }
  const name = document.getElementById('fdFormName').value.trim();
  if (currentForm) {
    currentForm.name = name;
    currentForm.desc = formSettings.desc;
    currentForm.fieldCount = collectAllFields().length;
    currentForm.updatedAt = new Date().toISOString().split('T')[0];
  }
  showToast('success', '保存成功', `表单「${escHtml(name)}」已保存`);
}

// 分栏预览：按栏并排渲染真实控件（<768px 时 CSS 堆叠为单列）
function renderPreviewColumns(field, index) {
  const colCount = Number(field.props?.colCount) || 2;
  const colsData = field.props?.columns_data || [];
  let html = '<div class="fd-preview-columns">';
  for (let ci = 0; ci < colCount; ci++) {
    const colFields = colsData[ci] || [];
    const colHtml = colFields.map((cf, fi) => renderPreviewField(cf, `${index}_${ci}_${fi}`)).join('');
    html += `<div class="fd-preview-column">${colHtml}</div>`;
  }
  html += '</div>';
  return html;
}

function renderPreviewField(field, id) {
  const req = field.props?.required ? '<span class="required-star">*</span>' : '';
  let html = `<div class="fd-preview-field" id="pvf_${id}">`;

  if (field.type === 'readonlyText') {
    const cls = field.props?.style === 'title' ? 'style-title' : field.props?.style === 'desc' ? 'style-desc' : '';
    html += `<div class="fd-readonly-text ${cls}">${escHtml(field.props?.text || '').replace(/\n/g, '<br/>')}</div></div>`;
    return html;
  }

  const boxed = ['shortText', 'longText', 'number', 'dropdown', 'datetime', 'person'].includes(field.type);
  const labelHtml = `<div class="field-label">${escHtml(field.name)}${req}</div>`;
  html += boxed ? `<div class="vf-wrap">${labelHtml}` : labelHtml;

  switch (field.type) {
    case 'shortText': {
      const maxAttr = field.props?.maxLength ? `maxlength="${Number(field.props.maxLength)}"` : '';
      html += `<input type="text" ${maxAttr} placeholder="${escHtml(field.props?.placeholder || '')}" value="${escHtml(field.props?.defaultValue || '')}" onchange="pvFieldChanged('${id}')" />`;
      break;
    }
    case 'longText': {
      const maxAttr = field.props?.maxLength ? `maxlength="${Number(field.props.maxLength)}"` : '';
      html += `<textarea ${maxAttr} placeholder="${escHtml(field.props?.placeholder || '')}" rows="${Number(field.props?.rows) || 4}">${escHtml(field.props?.defaultValue || '')}</textarea>`;
      break;
    }
    case 'number': {
      const u = field.props?.unit ? `<span style="margin-left:8px;font-size:12px;color:var(--md-on-surface-variant);">${escHtml(field.props.unit)}</span>` : '';
      html += `<div style="display:flex;align-items:center;"><input type="number" placeholder="请输入数字" style="flex:1;" value="${escHtml(field.props?.defaultValue ?? '')}" onchange="pvFieldChanged('${id}')" />${u}</div>`;
      break;
    }
    case 'radio': {
      const rLayout = field.props?.layout === 'horizontal' ? 'horizontal' : '';
      const defChecked = field.props?.defaultChecked;
      const items = (field.props?.options || []).map(o => {
        const chk = defChecked === o ? 'checked' : '';
        return `<label><input type="radio" name="field_${id}" value="${escHtml(o)}" ${chk} onchange="pvFieldChanged('${id}')" />${escHtml(o)}</label>`;
      }).join('');
      html += `<div class="fd-preview-radio ${rLayout}">${items}</div>`;
      break;
    }
    case 'checkbox': {
      const cbLayout = field.props?.layout === 'horizontal' ? 'horizontal' : '';
      const defArr = Array.isArray(field.props?.defaultChecked) ? field.props.defaultChecked : [];
      const items = (field.props?.options || []).map(o => {
        const chk = defArr.includes(o) ? 'checked' : '';
        return `<label><input type="checkbox" name="field_${id}" value="${escHtml(o)}" ${chk} />${escHtml(o)}</label>`;
      }).join('');
      html += `<div class="fd-preview-checkbox ${cbLayout}">${items}</div>`;
      break;
    }
    case 'dropdown':
      pvInitDropdown(field, id);
      html += `<div class="pv-dd" id="pvdd_${id}"><div class="pv-dd-trigger" onclick="ddToggle('${id}', event)">${ddTriggerInner(id)}</div></div>`;
      break;
    case 'datetime': {
      const isDate = field.props?.format === 'date';
      const dtType = isDate ? 'date' : 'datetime-local';
      let defVal = field.props?.defaultValue || '';
      if (defVal === '当前时间') {
        defVal = new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, isDate ? 10 : 16);
      }
      const minAttr = field.props?.minDate ? `min="${escHtml(field.props.minDate)}${isDate ? '' : 'T00:00'}"` : '';
      const maxAttr = field.props?.maxDate ? `max="${escHtml(field.props.maxDate)}${isDate ? '' : 'T23:59'}"` : '';
      html += `<input type="${dtType}" ${minAttr} ${maxAttr} value="${escHtml(defVal)}" onchange="pvFieldChanged('${id}')" />`;
      break;
    }
    case 'person':
      if (!pvPersons[id]) pvPersons[id] = [];
      html += `<div id="pvperson_${id}">${renderPersonFieldInner(field, id)}</div>`;
      break;
    case 'detail':
      html += renderPreviewDetail(field, id);
      break;
  }

  if (boxed) html += '</div>';
  html += `<div class="field-error" id="pverr_${id}">此项为必填</div></div>`;
  return html;
}

// ========== 自定义下拉组件 ==========
function pvInitDropdown(field, id) {
  const params = field.props?.params || [];
  const refParam = params.find(p => p.valueType === 'ref' && p.value);
  const refField = refParam ? refParam.value : (field.props?.linkField || null);
  const isMulti = field.props?.mode === 'multi';
  const isApi = field.props?.source === 'api';
  let defValue = isMulti ? [] : null;
  if (!isApi) {
    const def = field.props?.defaultChecked;
    if (isMulti && Array.isArray(def)) defValue = def.slice();
    else if (!isMulti && def) defValue = def;
  }
  pvDD[id] = {
    field, id,
    multi: isMulti,
    api: isApi,
    refField,
    options: isApi ? null : (field.props?.options || []).slice(),
    value: defValue,
    open: false, loading: false, error: false,
    loaded: !isApi,
    disabled: false
  };
}

function ddTriggerInner(id) {
  const st = pvDD[id];
  const caret = '<span class="pv-dd-caret"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg></span>';
  if (st.disabled) {
    return `<span class="pv-dd-placeholder">请先选择 ${escHtml(st.refField || '')}</span>${caret}`;
  }
  if (st.loading && !st.open) {
    return `<span class="pv-spinner"></span><span class="pv-dd-placeholder">加载中...</span>${caret}`;
  }
  if (st.multi) {
    const vals = st.value || [];
    if (vals.length === 0) return `<span class="pv-dd-placeholder">${escHtml(st.field.props?.placeholder || '请选择')}</span>${caret}`;
    const tags = vals.map((v, i) => `<span class="tag">${escHtml(v)}<span class="tag-close" onclick="ddRemoveTag('${id}',${i},event)">×</span></span>`).join('');
    return `${tags}${caret}`;
  }
  if (st.value) return `<span>${escHtml(st.value)}</span>${caret}`;
  return `<span class="pv-dd-placeholder">${escHtml(st.field.props?.placeholder || '请选择')}</span>${caret}`;
}

function ddRefreshTrigger(id) {
  const wrap = document.getElementById('pvdd_' + id);
  if (!wrap) return;
  const trigger = wrap.querySelector('.pv-dd-trigger');
  if (trigger) trigger.innerHTML = ddTriggerInner(id);
  wrap.classList.toggle('disabled', !!pvDD[id].disabled);
  wrap.classList.toggle('open', !!pvDD[id].open);
}

function ddClosePanel(id) {
  const st = pvDD[id];
  st.open = false;
  const wrap = document.getElementById('pvdd_' + id);
  if (!wrap) return;
  const panel = wrap.querySelector('.pv-dd-panel');
  if (panel) panel.remove();
  wrap.classList.remove('open');
}

function ddCloseAll(except) {
  Object.keys(pvDD).forEach(id => { if (id !== except && pvDD[id].open) ddClosePanel(id); });
}

document.addEventListener('click', function () { ddCloseAll(); });

function ddToggle(id, event) {
  if (event) event.stopPropagation();
  const st = pvDD[id];
  if (st.disabled) return;
  if (st.open) { ddClosePanel(id); return; }
  ddCloseAll(id);
  st.open = true;
  ddRenderPanel(id);
  if (st.api && !st.loaded && !st.loading) ddLoad(id);
}

function ddPanelInner(id) {
  const st = pvDD[id];
  if (st.loading) {
    return `<div class="pv-dd-status"><span class="pv-spinner"></span>加载中...</div>`;
  }
  if (st.error) {
    return `<div class="pv-dd-status"><span class="pv-dd-retry" onclick="ddRetry('${id}',event)">加载失败，点击重试</span></div>`;
  }
  const options = st.options || [];
  if (options.length === 0) {
    return `<div class="pv-dd-status">暂无选项</div>`;
  }
  if (st.multi) {
    const vals = st.value || [];
    return options.map((o, i) => {
      const chk = vals.includes(o) ? 'checked' : '';
      return `<div class="pv-dd-option" onclick="ddToggleMulti('${id}',${i},event)"><input type="checkbox" ${chk} onclick="event.stopPropagation();ddToggleMulti('${id}',${i},event)" />${escHtml(o)}</div>`;
    }).join('');
  }
  return options.map((o, i) => {
    const sel = st.value === o ? 'selected' : '';
    return `<div class="pv-dd-option ${sel}" onclick="ddSelectSingle('${id}',${i},event)">${escHtml(o)}</div>`;
  }).join('');
}

function ddRenderPanel(id) {
  const wrap = document.getElementById('pvdd_' + id);
  if (!wrap) return;
  let panel = wrap.querySelector('.pv-dd-panel');
  if (!panel) {
    panel = document.createElement('div');
    panel.className = 'pv-dd-panel';
    panel.onclick = function (e) { e.stopPropagation(); };
    wrap.appendChild(panel);
  }
  panel.innerHTML = ddPanelInner(id);
  wrap.classList.add('open');
}

function ddLoad(id) {
  const st = pvDD[id];
  st.loading = true;
  st.error = false;
  if (st.open) ddRenderPanel(id);
  ddRefreshTrigger(id);
  setTimeout(() => {
    st.loading = false;
    const ok = Math.random() < 0.8;
    if (!ok) {
      st.error = true;
      st.loaded = false;
    } else {
      st.error = false;
      st.loaded = true;
      if (st.refField) {
        const upVal = pvGetValueByName(st.refField);
        st.options = upVal ? buildLinkedOptions(upVal) : [];
      } else {
        st.options = MOCK_API_OPTIONS.slice();
      }
      // 刷新后原选中值不在新列表中则自动清空
      if (st.multi) {
        st.value = (st.value || []).filter(v => st.options.includes(v));
      } else if (st.value && !st.options.includes(st.value)) {
        st.value = null;
      }
    }
    if (st.open) ddRenderPanel(id);
    ddRefreshTrigger(id);
  }, 600);
}

function ddRetry(id, event) {
  if (event) event.stopPropagation();
  ddLoad(id);
}

function ddSelectSingle(id, optIndex, event) {
  if (event) event.stopPropagation();
  const st = pvDD[id];
  st.value = st.options[optIndex];
  ddClosePanel(id);
  ddRefreshTrigger(id);
  clearFieldError(id);
  pvNotifyChange(st.field.name);
}

function ddToggleMulti(id, optIndex, event) {
  if (event) event.stopPropagation();
  const st = pvDD[id];
  const opt = st.options[optIndex];
  if (!st.value) st.value = [];
  const idx = st.value.indexOf(opt);
  if (idx >= 0) st.value.splice(idx, 1); else st.value.push(opt);
  ddRefreshTrigger(id);
  if (st.open) ddRenderPanel(id);
  pvNotifyChange(st.field.name);
}

function ddRemoveTag(id, valIndex, event) {
  if (event) event.stopPropagation();
  const st = pvDD[id];
  st.value.splice(valIndex, 1);
  ddRefreshTrigger(id);
  if (st.open) ddRenderPanel(id);
  pvNotifyChange(st.field.name);
}

// ========== 数据联动 ==========
function pvGetValueByName(name) {
  for (const { field, id } of pvFields) {
    if (field.name !== name) continue;
    if (field.type === 'dropdown') {
      const st = pvDD[id];
      if (!st) return '';
      return st.multi ? ((st.value && st.value[0]) || '') : (st.value || '');
    }
    if (field.type === 'radio') {
      const checked = document.querySelector(`#pvf_${id} input[type=radio]:checked`);
      return checked ? checked.value : '';
    }
    const el = document.querySelector(`#pvf_${id} input, #pvf_${id} textarea`);
    return el ? el.value : '';
  }
  return '';
}

function pvFieldChanged(id) {
  const entry = pvFields.find(e => e.id === id);
  if (entry) pvNotifyChange(entry.field.name);
}

// 上游字段值变化 → 300ms 防抖后刷新依赖它的下拉
function pvNotifyChange(name) {
  Object.keys(pvDD).forEach(id => {
    const st = pvDD[id];
    if (st.refField !== name) return;
    clearTimeout(pvLinkTimers[id]);
    pvLinkTimers[id] = setTimeout(() => pvRefreshLinkState(id, false), 300);
  });
}

function pvRefreshLinkState(id, initial) {
  const st = pvDD[id];
  if (!st || !st.refField) return;
  const upVal = pvGetValueByName(st.refField);
  if (!upVal) {
    // 上游无值/清空：本下拉清空并禁用，提示「请先选择 XXX」
    st.value = st.multi ? [] : null;
    st.disabled = true;
    st.loaded = false;
    st.options = null;
    ddClosePanel(id);
    ddRefreshTrigger(id);
    return;
  }
  // 上游有值：解除禁用，清空旧值并重新加载
  st.disabled = false;
  if (!initial) { st.value = st.multi ? [] : null; }
  st.loaded = false;
  ddRefreshTrigger(id);
  ddLoad(id);
}

// ========== 人员选择（模拟 LionKing） ==========
function renderPersonFieldInner(field, id) {
  const selected = pvPersons[id] || [];
  if (selected.length === 0) {
    return `<div class="fd-person-selector" onclick="openPersonPicker('${id}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg><span>点击选择人员</span></div>`;
  }
  const tags = selected.map((p, i) => `<span class="tag">${escHtml(p)}<span class="tag-close" onclick="removePerson('${id}',${i},event)">×</span></span>`).join('');
  return `<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-height:40px;padding:4px 12px;border:1px solid var(--md-outline-variant);border-radius:var(--radius-sm);cursor:pointer;" onclick="openPersonPicker('${id}')">${tags}</div>`;
}

function refreshPersonField(id) {
  const entry = pvFields.find(e => e.id === id);
  const wrap = document.getElementById('pvperson_' + id);
  if (entry && wrap) wrap.innerHTML = renderPersonFieldInner(entry.field, id);
}

function openPersonPicker(id) {
  const entry = pvFields.find(e => e.id === id);
  if (!entry) return;
  const isMulti = entry.field.props?.personMode === 'multi';
  const buttons = isMulti
    ? [{ text: '取消', class: 'btn btn-outlined', onclick: 'closeModal()' }, { text: '确定', class: 'btn btn-primary', onclick: `applyPersonPick('${id}')` }]
    : [{ text: '取消', class: 'btn btn-outlined', onclick: 'closeModal()' }];
  showModal(`选择人员（${isMulti ? '多人' : '单人'}）`, `
    <div class="form-search" style="min-width:0;width:100%;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="text" id="personSearchInput" placeholder="搜索姓名或部门..." oninput="renderPersonPickerList('${id}', this.value)" />
    </div>
    <div class="pv-person-list" id="personPickerList"></div>
  `, buttons);
  renderPersonPickerList(id, '');
}

function renderPersonPickerList(id, keyword) {
  const entry = pvFields.find(e => e.id === id);
  const isMulti = entry && entry.field.props?.personMode === 'multi';
  const selected = pvPersons[id] || [];
  const kw = (keyword || '').trim().toLowerCase();
  const list = MOCK_PERSONS.filter(p => !kw || p.name.toLowerCase().includes(kw) || p.dept.toLowerCase().includes(kw));
  const container = document.getElementById('personPickerList');
  if (!container) return;
  if (list.length === 0) {
    container.innerHTML = '<div style="text-align:center;padding:24px;color:var(--md-outline);font-size:12px;">未找到匹配的人员</div>';
    return;
  }
  container.innerHTML = list.map(p => {
    const chkHtml = isMulti ? `<input type="checkbox" value="${escHtml(p.name)}" ${selected.includes(p.name) ? 'checked' : ''} onclick="event.stopPropagation()" />` : '';
    const clickAttr = isMulti ? '' : `onclick="pickSinglePerson('${id}','${escHtml(p.name)}')"`;
    return `<div class="pv-person-item" ${clickAttr}>${chkHtml}<div class="pv-person-avatar">${escHtml(p.name.charAt(0))}</div><span>${escHtml(p.name)}</span><span class="pv-person-dept">${escHtml(p.dept)}</span></div>`;
  }).join('');
}

function pickSinglePerson(id, name) {
  pvPersons[id] = [name];
  closeModal();
  refreshPersonField(id);
  clearFieldError(id);
}

function applyPersonPick(id) {
  const container = document.getElementById('personPickerList');
  if (!container) return;
  // 合并当前已选（搜索过滤时未显示的保持选中）与列表勾选
  const visibleNames = Array.from(container.querySelectorAll('.pv-person-item input')).map(i => i.value);
  const checkedNames = Array.from(container.querySelectorAll('.pv-person-item input:checked')).map(i => i.value);
  const kept = (pvPersons[id] || []).filter(n => !visibleNames.includes(n));
  pvPersons[id] = kept.concat(checkedNames);
  closeModal();
  refreshPersonField(id);
  if (pvPersons[id].length) clearFieldError(id);
}

function removePerson(id, index, event) {
  if (event) event.stopPropagation();
  pvPersons[id].splice(index, 1);
  refreshPersonField(id);
}

// ========== 明细（预览可交互） ==========
function renderPreviewDetail(field, id) {
  const cols = field.props?.columns || [];
  let html = `<div style="overflow-x:auto;"><table class="fd-preview-detail-table"><thead><tr><th style="width:44px;text-align:center;">序号</th>`;
  cols.forEach(c => { html += `<th>${escHtml(c.name)}${c.required ? ' <span style="color:var(--md-error);">*</span>' : ''}</th>`; });
  html += `<th style="width:56px;text-align:center;">操作</th></tr></thead><tbody id="pvdt_body_${id}">`;
  html += pvDetailRowHtml(field, id);
  html += '</tbody></table></div>';
  html += `<div style="text-align:center;margin-top:8px;">
    <button class="btn btn-text btn-sm" id="pvdt_add_${id}" onclick="pvAddDetailRow('${id}')">+ 添加一行</button>
  </div>`;
  return html;
}

function pvDetailCellHtml(c) {
  let ctrl;
  if (c.type === 'dropdown') {
    const opts = (c.options || []).map(o => `<option value="${escHtml(o)}">${escHtml(o)}</option>`).join('');
    ctrl = `<select style="width:100%;height:32px;font-size:12px;"><option value="">请选择</option>${opts}</select>`;
  } else if (c.type === 'date') {
    ctrl = '<input type="date" style="width:100%;height:32px;font-size:12px;" />';
  } else if (c.type === 'number') {
    ctrl = '<input type="number" placeholder="0" style="width:100%;height:32px;font-size:12px;" />';
  } else {
    ctrl = '<input type="text" placeholder="请输入" style="width:100%;height:32px;font-size:12px;" />';
  }
  return `<td><div class="dt-cell">${ctrl}<div class="dt-cell-err">此项为必填</div></div></td>`;
}

function pvDetailRowHtml(field, id) {
  const cols = field.props?.columns || [];
  const cells = cols.map(c => pvDetailCellHtml(c)).join('');
  return `<tr>
    <td class="dt-index" style="text-align:center;color:var(--md-on-surface-variant);font-size:12px;"></td>
    ${cells}
    <td style="text-align:center;"><button class="btn-icon pvdt-del" onclick="pvRemoveDetailRow(this,'${id}')" title="删除"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px;"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button></td>
  </tr>`;
}

function pvGetDetailField(id) {
  const entry = pvFields.find(e => e.id === id);
  return entry ? entry.field : null;
}

function pvAddDetailRow(id) {
  const field = pvGetDetailField(id);
  const tbody = document.getElementById('pvdt_body_' + id);
  if (!field || !tbody) return;
  tbody.insertAdjacentHTML('beforeend', pvDetailRowHtml(field, id));
  pvUpdateDetailButtons(id);
}

function pvRemoveDetailRow(btn, id) {
  const field = pvGetDetailField(id);
  const tbody = document.getElementById('pvdt_body_' + id);
  if (!field || !tbody) return;
  if (tbody.rows.length <= 1) return;
  const tr = btn.closest('tr');
  if (tr) tr.remove();
  pvUpdateDetailButtons(id);
}

function pvUpdateDetailButtons(id) {
  const field = pvGetDetailField(id);
  const tbody = document.getElementById('pvdt_body_' + id);
  if (!field || !tbody) return;
  const rows = tbody.rows.length;
  // 序号重排
  Array.from(tbody.rows).forEach((tr, i) => {
    const idx = tr.querySelector('.dt-index');
    if (idx) idx.textContent = i + 1;
  });
  // 只剩 1 行时删除按钮置灰
  tbody.querySelectorAll('.pvdt-del').forEach(b => {
    b.disabled = rows <= 1;
    b.style.opacity = rows <= 1 ? '0.38' : '';
    b.style.pointerEvents = rows <= 1 ? 'none' : '';
  });
}

// ========== 提交校验 ==========
function setFieldError(id, msg) {
  const el = document.getElementById('pvf_' + id);
  const err = document.getElementById('pverr_' + id);
  if (!el) return;
  el.classList.add('has-error');
  if (err) err.textContent = msg;
}

function clearFieldError(id) {
  const el = document.getElementById('pvf_' + id);
  if (el) el.classList.remove('has-error');
}

function pvValidateField(field, id) {
  // 返回错误文案；无错误返回 null
  const el = document.getElementById('pvf_' + id);
  if (!el) return null;
  const p = field.props || {};
  switch (field.type) {
    case 'shortText':
    case 'longText': {
      const input = el.querySelector('input, textarea');
      if (p.required && !(input && input.value.trim())) return '此项为必填';
      return null;
    }
    case 'number': {
      const input = el.querySelector('input[type=number]');
      const raw = input ? input.value : '';
      if (p.required && raw === '') return '此项为必填';
      if (raw !== '') {
        const num = Number(raw);
        const hasMin = p.min !== '' && p.min !== undefined && p.min !== null;
        const hasMax = p.max !== '' && p.max !== undefined && p.max !== null;
        if (hasMin && hasMax && (num < Number(p.min) || num > Number(p.max))) return `请输入 ${p.min} 到 ${p.max} 之间的数字`;
        if (hasMin && !hasMax && num < Number(p.min)) return `请输入不小于 ${p.min} 的数字`;
        if (!hasMin && hasMax && num > Number(p.max)) return `请输入不大于 ${p.max} 的数字`;
      }
      return null;
    }
    case 'radio': {
      if (p.required && !el.querySelector('input[type=radio]:checked')) return '此项为必填';
      return null;
    }
    case 'checkbox': {
      const count = el.querySelectorAll('input[type=checkbox]:checked').length;
      if (p.required && count === 0) return '此项为必填';
      return null;
    }
    case 'dropdown': {
      const st = pvDD[id];
      if (!st) return null;
      const empty = st.multi ? !(st.value && st.value.length) : !st.value;
      if (p.required && empty) return '此项为必填';
      return null;
    }
    case 'datetime': {
      const input = el.querySelector('input');
      if (p.required && !(input && input.value)) return '此项为必填';
      return null;
    }
    case 'person': {
      if (p.required && !(pvPersons[id] && pvPersons[id].length)) return '此项为必填';
      return null;
    }
    case 'detail':
      return pvValidateDetail(field, id);
  }
  return null;
}

function pvValidateDetail(field, id) {
  const p = field.props || {};
  const tbody = document.getElementById('pvdt_body_' + id);
  if (!tbody) return null;
  if (p.required && tbody.rows.length === 0) return '此项为必填';
  // 必填列逐行逐列校验，对应单元格标红
  const cols = p.columns || [];
  let cellError = false;
  Array.from(tbody.rows).forEach(tr => {
    cols.forEach((c, cidx) => {
      const td = tr.cells[cidx + 1]; // 第 0 列是序号
      if (!td) return;
      const cellWrap = td.querySelector('.dt-cell');
      const ctrl = td.querySelector('input, select');
      if (!cellWrap || !ctrl) return;
      if (c.required && !ctrl.value) {
        cellWrap.classList.add('error');
        cellError = true;
      } else {
        cellWrap.classList.remove('error');
      }
    });
  });
  return cellError ? '' : null; // '' 表示有单元格级错误（字段下方不再重复提示）
}

function handlePreviewSubmit(btn) {
  if (pvSubmitting) return;
  let firstErrorEl = null;
  let hasError = false;
  pvFields.forEach(({ field, id }) => {
    if (field.type === 'readonlyText') return;
    const msg = pvValidateField(field, id);
    if (msg === null) {
      clearFieldError(id);
    } else {
      hasError = true;
      if (msg) setFieldError(id, msg); else clearFieldError(id);
      if (!firstErrorEl) firstErrorEl = document.getElementById('pvf_' + id);
    }
  });
  if (hasError) {
    if (firstErrorEl) firstErrorEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
    return;
  }
  // 提交 loading（防重复点击）
  pvSubmitting = true;
  const originalHtml = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<span class="pv-spinner"></span>提交中...';
  setTimeout(() => {
    btn.disabled = false;
    btn.innerHTML = originalHtml;
    pvSubmitting = false;
    showToast('success', '提交成功', '表单校验通过，已提交（预览模式不会实际提交）');
  }, 800);
}

// --- Modal ---
function showModal(title, bodyHtml, buttons) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').innerHTML = bodyHtml;
  document.getElementById('modalFooter').innerHTML = buttons.map(b => {
    const style = b.style ? ` style="${b.style}"` : '';
    return `<button class="${b.class}"${style} onclick="${b.onclick}">${b.text}</button>`;
  }).join('');
  document.getElementById('modalOverlay').classList.add('active');
  // 打开后自动聚焦首个输入框
  setTimeout(() => {
    const first = document.getElementById('modalBody').querySelector('input, textarea, select');
    if (first) first.focus();
  }, 50);
}

function closeModal(event) {
  if (event && event.target !== event.currentTarget) return;
  document.getElementById('modalOverlay').classList.remove('active');
}

// --- ESC 关闭（弹窗优先，其次预览覆盖层） ---
document.addEventListener('keydown', function (e) {
  if (e.key !== 'Escape') return;
  if (document.getElementById('modalOverlay').classList.contains('active')) {
    closeModal();
    return;
  }
  if (document.getElementById('previewOverlay').classList.contains('active')) {
    closePreview();
  }
});

// --- Toast ---
function showToast(type, title, msg) {
  const container = document.getElementById('toastContainer');
  const icons = {
    success: '<svg viewBox="0 0 24 24" fill="none" stroke="#188038" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>',
    error: '<svg viewBox="0 0 24 24" fill="none" stroke="#D93025" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></svg>',
    info: '<svg viewBox="0 0 24 24" fill="none" stroke="#1A73E8" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>'
  };
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.innerHTML = `${icons[type] || icons.info}<div><strong>${title}</strong>${msg ? '<div style="color:var(--md-on-surface-variant);margin-top:2px;">' + msg + '</div>' : ''}</div>`;
  container.appendChild(toast);
  setTimeout(() => { toast.style.opacity = '0'; toast.style.transform = 'translateX(20px)'; toast.style.transition = '0.3s'; setTimeout(() => toast.remove(), 300); }, 3000);
}

// --- 初始化 ---
renderFormList();
